<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人技能库 · 流向图（30 技能 · 6 组全链路）</title>
<style>
  :root{
    --ink:#2b3138; --sub:#7c8690; --line:#eceff3; --bg:#f7f8fa;
    --prod:#3aa76d; --prod-bg:#e7f5ed;
    --eng:#0d9488; --eng-bg:#e6f6f4;
    --think:#3b8fd1; --think-bg:#e8f2fb;
    --write:#e0823f; --write-bg:#fdf0e4;
    --util:#8b95a0; --util-bg:#f0f2f5;
    --src:#94a0ac; --res:#8b73d6; --res-bg:#f1edfd;
    --flow:#c7d0da;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;}
  header{padding:26px 30px 2px}
  h1{font-size:22px;font-weight:700;margin:0 0 6px;letter-spacing:.2px}
  .lead{color:var(--sub);font-size:13.5px;margin:0;line-height:1.6}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:10px 30px 4px;flex-wrap:wrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 15px;cursor:pointer;font-size:13px;color:#525b64;user-select:none;
    transition:all .15s}
  .chip:hover{border-color:#c4ccd4}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .dot{width:9px;height:9px;border-radius:50%}
  .layout{display:flex;gap:18px;padding:12px 22px 26px;align-items:flex-start}
  .card{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:10px 6px;box-shadow:0 1px 2px rgba(30,40,50,.04)}
  svg{display:block;min-width:1180px;width:100%;height:auto}
  .aside{width:316px;flex:0 0 316px;position:sticky;top:18px;background:#fff;border:1px solid var(--line);
    border-radius:18px;padding:22px;min-height:360px}
  @media(max-width:980px){.layout{flex-direction:column}.aside{width:100%;flex:none;position:static}.card{overflow-x:auto}}
  body.print{background:#fff}
  body.print header,body.print .bar,body.print .aside{display:none}
  body.print .layout{padding:0}
  body.print .card{border:none;border-radius:0;box-shadow:none;padding:0}
  body.print .colhead{display:none}

  .flow{fill:var(--flow);opacity:.55;transition:opacity .15s}
  .flow.muted{opacity:.06}
  .flow.hot{opacity:.9}
  .node{cursor:pointer}
  .node .cap{fill:#fff;stroke:#d3dae1;stroke-width:1.5}
  .node.src .cap{fill:#f1f3f5;stroke:none}
  .node.res .cap{fill:var(--res-bg);stroke:#d9cef6}
  .node.prod .cap{fill:var(--prod-bg);stroke:#bfe3cf}
  .node.eng .cap{fill:var(--eng-bg);stroke:#99ddd4}
  .node.think .cap{fill:var(--think-bg);stroke:#c2ddf2}
  .node.write .cap{fill:var(--write-bg);stroke:#f3d3b8}
  .node.util .cap{fill:var(--util-bg);stroke:#dde2e7}
  .node.test .cap{fill:#fff;stroke:var(--think);stroke-width:2.2}
  .node .lab{font-size:12px;font-weight:600;fill:var(--ink);pointer-events:none}
  .node.src .lab{font-weight:500;fill:#4b555d}
  .node.res .lab{font-weight:600;fill:#5e4bb0}
  .node.dim .cap{opacity:.22}.node.dim .lab{opacity:.22}
  .colhead{font-size:11px;font-weight:700;fill:#9aa4ad;letter-spacing:1.6px;text-transform:uppercase}
  .aside h2{font-size:17px;margin:0 0 2px}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 11px;margin:0 6px 12px 0}
  .t-prod{background:var(--prod-bg);color:var(--prod)}.t-eng{background:var(--eng-bg);color:var(--eng)}
  .t-think{background:var(--think-bg);color:var(--think)}
  .t-write{background:var(--write-bg);color:var(--write)}.t-util{background:var(--util-bg);color:#5f6a74}
  .t-src{background:#f1f3f5;color:#4b555d}.t-res{background:var(--res-bg);color:#6a54b8}
  .t-test{background:#fff;color:var(--think);border:1.5px solid var(--think)}
  .aside p{font-size:13px;line-height:1.7;margin:8px 0}
  .aside .k{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px;margin:16px 0 3px}
  .g{font-size:13px;line-height:1.65}
  .good{color:#2e8a55}.bad{color:#c0492f}
  .hint{color:var(--sub);font-size:13px;line-height:1.8}
  .hint b{color:var(--ink)}
  .close{float:right;cursor:pointer;color:#c0c7ce;font-size:20px;line-height:1;margin-top:-4px}
  .close:hover{color:var(--ink)}
  .linesub{font-size:12.5px;color:var(--sub);line-height:1.7;margin:4px 0 2px}
  .lg-line{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:#fafbfc;
    border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-top:9px;cursor:pointer;
    font-size:13px;color:var(--ink);transition:border-color .12s}
  .lg-line:hover{border-color:#c2cad2}
  .lg-line .meta{margin-left:auto;color:var(--sub);font-size:11px;white-space:nowrap}
  .lg-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed #eef1f4;cursor:pointer}
  .lg-row:hover{background:#fafbfc}.lg-row:last-child{border-bottom:none}
  .lg-idx{width:20px;height:20px;border-radius:50%;flex:none;margin-top:1px;color:#fff;font-size:10px;
    display:flex;align-items:center;justify-content:center;font-weight:700}
  .lg-row.branch .lg-idx{background:#fff;border:1.6px dashed #9aa4ad;color:#8b95a0}
  .lg-row b{font-size:13px;font-weight:600}
  .lg-row span{display:block;font-size:12px;color:var(--sub);line-height:1.55;margin-top:2px}
</style>
</head>
<body>
<header>
  <h1>个人技能库 · 流向图（30 技能 · 6 大逻辑组）</h1>
  <p class="lead">从左到右：日常任务入口 → 对应技能 → 枢纽 / 规格状态机 → 审查 / 门禁 → 最终产出。<b style="color:var(--ink)">产品孵化（绿）与研发全周期（青）打通「想法 → 规格 → 盲审 → 编码 → CR / 排障 → PR → 终审」。</b></p>
</header>
<div class="bar">
  <div class="filters" id="filters">
    <span class="chip active" data-f="all">全部</span>
    <span class="chip" data-f="prod"><i class="dot" style="background:var(--prod)"></i>产品孵化</span>
    <span class="chip" data-f="eng"><i class="dot" style="background:var(--eng)"></i>研发全周期</span>
    <span class="chip" data-f="think"><i class="dot" style="background:var(--think)"></i>批判决策</span>
    <span class="chip" data-f="write"><i class="dot" style="background:var(--write)"></i>写作与图</span>
    <span class="chip" data-f="util"><i class="dot" style="background:var(--util)"></i>工具与治理</span>
  </div>
</div>

<div class="layout">
  <div class="card"><svg id="chart" viewBox="0 0 1520 940"></svg></div>
  <aside class="aside" id="aside"></aside>
</div>

<script>
const PAL={
  prod:['#3aa76d','#e7f5ed'],
  eng:['#0d9488','#e6f6f4'],
  think:['#3b8fd1','#e8f2fb'],
  write:['#e0823f','#fdf0e4'],
  util:['#8b95a0','#f0f2f5']
};
const N={};
function n(o){N[o.id]=o;}

// —— 列 1：任务源 ——
[
 ['t_find','发现 / 评估机会'],
 ['t_decide','想清楚、做决定'],
 ['t_verify','验证信息或文章'],
 ['t_try','低成本实验'],
 ['t_learn','拆解优秀成品'],
 ['t_build','产品需求 / 原型 / 技术方案'],
 ['t_code','开发功能 / 重构 / 盲审编码'],
 ['t_fix','排障修 Bug / 代码 CR / 提 PR'],
 ['t_write','写作 / 调研 / 改稿 / 评测'],
 ['t_tool','日报 / 档案 / 音视频图 / 治理']
].forEach(([id,label])=>n({id,label,d:0,c:'src'}));

// —— 列 2：主技能（30 个覆盖）——
[
 ['radar','机会雷达','prod','exist'],['scorecard','机会评分卡','prod','exist'],
 ['brief','产品需求','prod','exist'],['compass','设计罗盘','prod','exist'],
 ['reverse-teardown','反向拆解','prod','exist'],
 ['engineering-docs','技术文档 RFC','eng','exist'],
 ['implement-spec','实现规格 spec','eng','exist'],
 ['spec-battle','方案盲审 battle','eng','exist'],
 ['go-work','分步编码执行','eng','exist'],
 ['diff-review','只读深度 CR','eng','exist'],
 ['code-bugfix','红灯排障修复','eng','exist'],
 ['steelman-choice','钢人抉择','think','exist'],['root-rethink','归本重推','think','exist'],
 ['claim-check','说法核查','think','exist'],['argument-reading','论证精读','think','exist'],
 ['minimum-experiment','最小实验','think','exist'],
 ['feynman','费曼讲透','write','exist'],['sansi','三思改稿','write','exist'],
 ['writing-craft','写作工坊','write','exist'],['haohao','去 AI 味','write','exist'],
 ['haohao-eval','评测台','write','exist'],['infographic','信息图','write','exist'],
 ['png','PNG 压缩','util','exist'],['video','视频解读','util','exist'],
 ['briefing','AI 日报','util','exist'],['me-context','个人档案','util','exist'],
 ['skill-library-keeper','技能管家','util','exist']
].forEach(([id,label,c,st])=>n({id,label,d:1,c,status:st}));

// —— 列 3：共用枢纽 / 状态机 ——
[
 ['hub_brief','产品需求 / 轻卡片','prod'],
 ['hub_design','设计 / 原型规格','prod'],
 ['hub_spec','开放 Spec 状态机','eng'],
 ['hub_proof','取证 · 兼听','think'],
 ['hub_lint','去 AI 味','write']
].forEach(([id,label,c])=>n({id,label,d:2,c}));

// —— 列 4：交付前关口 ——
n({id:'pr-prep',label:'PR 打包与视觉导览',d:3,c:'eng'});
n({id:'vdd',label:'完成验证与对抗评审',d:3,c:'eng'});

// —— 列 5：产出 ——
[
 ['o_opp','机会 / 评分结论'],['o_decide','清醒选择'],
 ['o_truth','可信判断'],['o_exp','实验反馈'],
 ['o_rule','可迁移规律'],['o_plan','PRD / 原型 / RFC'],
 ['o_code','干净代码与 PR'],['o_ship','验证放行交付'],
 ['o_write','对外成稿与信息图'],['o_meta','工具 / 档案 / 治理']
].forEach(([id,label])=>n({id,label,d:4,c:'res'}));

// —— 流：[源, 目标, 权重] ——
const E=[];const e=(s,t,w=1)=>E.push({s,t,w});
// 任务源
e('t_find','radar',2);e('t_find','scorecard',2);
e('t_decide','steelman-choice',2);e('t_decide','root-rethink',2);
e('t_verify','claim-check',2);e('t_verify','argument-reading',2);
e('t_try','minimum-experiment',2);e('t_learn','reverse-teardown',2);
e('t_build','brief',2);e('t_build','compass',2);e('t_build','engineering-docs',2);
e('t_code','implement-spec',3);e('t_code','spec-battle',2);e('t_code','go-work',3);
e('t_fix','code-bugfix',2);e('t_fix','diff-review',3);
e('t_write','feynman');e('t_write','sansi');e('t_write','writing-craft',2);e('t_write','haohao-eval');e('t_write','infographic');
e('t_tool','png');e('t_tool','video');e('t_tool','briefing');e('t_tool','me-context');e('t_tool','skill-library-keeper');

// 产品孵化
e('radar','scorecard');e('radar','o_opp');e('scorecard','o_opp');
e('scorecard','brief',2);e('brief','hub_brief',3);e('compass','hub_design',3);
e('hub_brief','o_plan',2);e('hub_design','o_plan',2);
e('hub_brief','implement-spec',2);e('hub_design','implement-spec');

// 研发全周期
e('engineering-docs','o_plan');e('engineering-docs','hub_spec',2);
e('implement-spec','hub_spec',3);e('spec-battle','hub_spec',2);
e('hub_spec','go-work',3);e('go-work','diff-review',2);
e('diff-review','pr-prep',3);e('code-bugfix','diff-review');e('code-bugfix','vdd',2);
e('pr-prep','vdd',3);e('pr-prep','o_code',3);e('vdd','o_ship',3);

// 思维旁路
e('steelman-choice','hub_proof',2);e('claim-check','hub_proof',2);
e('argument-reading','hub_proof',2);e('root-rethink','hub_proof');
e('hub_proof','o_truth',3);e('claim-check','o_truth');e('argument-reading','o_truth',2);
e('steelman-choice','o_decide',2);e('root-rethink','o_decide');e('root-rethink','steelman-choice');
e('steelman-choice','hub_brief');
e('minimum-experiment','o_exp',2);e('minimum-experiment','hub_brief',2);
e('reverse-teardown','o_rule',2);e('reverse-teardown','hub_design',2);e('reverse-teardown','hub_brief');

// 写作
e('writing-craft','feynman');e('feynman','o_write');
['writing-craft','sansi','haohao','haohao-eval','feynman'].forEach(x=>e(x,'hub_lint'));
e('infographic','o_write',2);e('hub_lint','o_write',3);

// 工具与治理
['png','video','briefing','me-context','skill-library-keeper'].forEach(x=>e(x,'o_meta'));

const COLX=[210,460,760,1050,1340], NW=12, GAP=10, TOP=54, H=890;
Object.values(N).forEach(x=>{x.in=0;x.out=0;});
E.forEach(({s,t,w})=>{N[s].out+=w;N[t].in+=w;});
const cols={};Object.values(N).forEach(x=>(cols[x.d]=cols[x.d]||[]).push(x));

function order(d){
  const rank={src:0,prod:1,eng:2,think:3,write:4,util:5,res:6};
  const arr=cols[d];
  if(d===1) arr.sort((a,b)=>rank[a.c]-rank[b.c] || a.label.localeCompare(b.label));
  if(d===2) arr.sort((a,b)=>rank[a.c]-rank[b.c]);
}
[0,1,2,3,4].forEach(order);

Object.entries(cols).forEach(([d,arr])=>{
  d=+d;
  const total=arr.reduce((s,x)=>s+Math.max(x.in,x.out,1),0);
  const fixed=(d===0||d===4);
  const usable=H-140-(arr.length-1)*GAP;
  let y=TOP;
  arr.forEach(x=>{
    const f=Math.max(x.in,x.out,1);
    let h=fixed?22:Math.max(15,f/total*usable);
    h=Math.min(h,d===2?52:36);
    x.h=h;x.y=y;y+=h+GAP;
  });
  const used=y-GAP-TOP,off=Math.max((H-50-used)/2,0);
  arr.forEach(x=>x.y+=off);
});

const NS='http://www.w3.org/2000/svg',svg=document.getElementById('chart');
Object.values(N).forEach(x=>{x.ic=0;x.oc=0;});

['你在做的事','主技能','共用枢纽 / 状态机','交付与门禁','产出'].forEach((t,i)=>{
  const el=document.createElementNS(NS,'text');el.setAttribute('class','colhead');
  el.setAttribute('x',COLX[i]);el.setAttribute('y',38);el.setAttribute('text-anchor','middle');el.textContent=t;
  svg.appendChild(el);
});

function band(s,t,w){
  const x0=COLX[s.d]+NW/2,x1=COLX[t.d]-NW/2;
  const y0=s.y+s.oc+w/2,y1=t.y+t.ic+w/2;s.oc+=w+2.0;t.ic+=w+2.0;
  const cx=(x0+x1)/2;
  return `M${x0},${y0-w/2} C${cx},${y0-w/2} ${cx},${y1-w/2} ${x1},${y1-w/2}
          L${x1},${y1+w/2} C${cx},${y1+w/2} ${cx},${y0+w/2} ${x0},${y0+w/2} Z`;
}
const flowEls=[];
E.forEach(edge=>{
  const p=document.createElementNS(NS,'path');
  p.setAttribute('class','flow');
  p.setAttribute('d',band(N[edge.s],N[edge.t],4.5+edge.w*2.1));
  p.dataset.s=edge.s;p.dataset.t=edge.t;p.dataset.c=N[edge.t].c;
  svg.appendChild(p);flowEls.push(p);
});

Object.values(N).forEach(x=>{
  const g=document.createElementNS(NS,'g');
  g.setAttribute('class',`node ${x.c}`);
  g.dataset.id=x.id;g.dataset.c=x.c;
  const r=document.createElementNS(NS,'rect');
  r.setAttribute('class','cap');
  r.setAttribute('x',COLX[x.d]-NW/2);r.setAttribute('y',x.y);
  r.setAttribute('width',NW);r.setAttribute('height',x.h);r.setAttribute('rx',NW/2);
  g.appendChild(r);
  const t=document.createElementNS(NS,'text');t.setAttribute('class','lab');
  const left=x.d===0;
  t.setAttribute('x',COLX[x.d]+(left?-14:NW/2+12));
  t.setAttribute('y',x.y+x.h/2+4);
  t.setAttribute('text-anchor',left?'end':'start');t.textContent=x.label;
  g.appendChild(t);
  g.addEventListener('mouseenter',()=>spot(x.id,true));
  g.addEventListener('mouseleave',()=>spot(x.id,false));
  g.addEventListener('click',()=>detail(x));
  svg.appendChild(g);
});

function family(id){
  const set=new Set([id]);let go=true;
  while(go){go=false;
    E.forEach(({s,t})=>{if(set.has(s)&&!set.has(t)){set.add(t);go=true;}if(set.has(t)&&!set.has(s)){set.add(s);go=true;}});}
  return set;
}
function spot(id,on){
  const f=family(id);
  flowEls.forEach(p=>{
    const linked=f.has(p.dataset.s)&&f.has(p.dataset.t);
    p.classList.toggle('hot',on&&linked);
    p.classList.toggle('muted',on&&!linked);
    if(on&&linked){p.style.fill=PAL[p.dataset.c]?.[0]||'#8b95a0';}
    if(!on)p.style.fill='';
  });
  document.querySelectorAll('.node').forEach(g=>g.classList.toggle('dim',on&&!f.has(g.dataset.id)));
}

const DET={
 radar:['扫出带来源证据的产品机会。','独立机会扫描。','线索可追溯。','丢没来源的空话。'],
 scorecard:['十维脚本打分评估想法潜力。','独立定量体检。','低分立拦。','精准却无证据。'],
 brief:['需求/轻卡片+GLOSSARY+计划。','直接定义交付范围。','每条可验证。','愿望清单。'],
 compass:['9 套风格包与动效原型/DESIGN.md。','独立设计评审。','动静与 tokens 一致。','好看却偏需求。'],
 'reverse-teardown':['从优秀成品拆解规律与练习。','见好成品随时学。','指出3个可搬动作。','只夸简洁不落地。'],
 'engineering-docs':['RFC/ADR 与工程架构图。','独立方案评审。','决定附代价回退。','只列目录不取舍。'],
 'implement-spec':['将确认需求编译为深模块接口+1-commit 步骤。','适配个人仓与大仓。','每步含 After 与可跑 Check。','照抄幻想假符号。'],
 'spec-battle':['干净只读子代理盲审方案/Spec。','防自我确认偏误。','起诉四件套+写死隔离回流。','自问自答和稀泥。'],
 'go-work':['低上下文协调分步提交并归档 Spec。','断点跨会话无损续跑。','主会话不囤源码不篡改 Spec。','大段读码或偷改计划。'],
 'diff-review':['分级 CR + Skeptic 证伪去误报。','只读不破坏现场。','高危标红人审+误报剔除。','硬凑低价值挑刺。'],
 'code-bugfix':['秒级红灯复现→3假设证伪→回归+清扫。','防对着症状贴补丁。','命中同源相邻缺陷。','没见红灯先改代码。'],
 'pr-prep':['卫生拦截、拆包建议与 $TMPDIR HTML 导览。','发 PR 不污染公司仓。','一分钟看清变更与回滚。','私密草稿误入仓或越权 push。'],
 vdd:['完成实证门禁与 3+1 多角色对抗评审团。','防无证报喜与盲区。','无问题敢签收无需修改。','未实测说应该行。'],
 hub_spec:['开放 Spec 状态核（Source hash+进度）。','防上游漂移硬跑。','漂移立即熔断。','脑补过期文档。'],
 hub_proof:['有纪律补充外部证据。','独立检索止损。','冲突交代清楚。','盲目乱搜。'],
 hub_brief:['PRD 与轻特性卡片汇聚点。','—','需求对齐可开工。','停留在口头。'],
 hub_design:['UI 规格汇聚点。','—','规律落地成界面。','设计归设计。'],

const CN={prod:'产品孵化',eng:'研发全周期',think:'批判决策',write:'写作与图',util:'工具治理',src:'任务入口',res:'交付产出'};

let activeLine=null;
const LINE_GUIDE={
 prod:{title:'产品孵化线（OPC 0→1 / 1→N）',color:'var(--prod)',
   sub:'发现机会、十维评分、写 PRD/轻卡片、定界面与动效规格，随后交接进入研发全周期。',
   when:'做新产品、新功能规划或界面原型设计。',
   nodes:[['radar',1],['scorecard',2],['brief',3],['compass',4]],
   branches:[['reverse-teardown','旁挂：拆解优秀成品回流需求与设计']]},
 eng:{title:'研发全周期（个人仓 / 公司大仓通用）',color:'var(--eng)',
   sub:'技术方案、编码 Spec（Source hash 防漂移）、干净对抗盲审、低上下文分步落地、Skeptic CR、红灯排障、PR 视觉导览与 VDD/多角色终审。',
   when:'进代码仓开发新功能、重构、排障修 Bug、审同事 MR 或准备提 PR（配合 agy 插件自动流转）。',
   nodes:[['engineering-docs',1],['implement-spec',2],['spec-battle',3],['go-work',4],['diff-review',5],['pr-prep',6],['vdd',7]],
   branches:[['code-bugfix','分支：报错崩溃回归直接走红灯排障与 Sibling 清扫']]},
 think:{title:'批判决策线',color:'var(--think)',
   sub:'卡住时的旁路：重推根因、钢人二选一、核说法、精读论证与最小实验。',
   when:'技术/产品决策犹豫、排查材料真伪或设计低成本试错。',
   nodes:[['root-rethink',1],['steelman-choice',2],['claim-check',3],['argument-reading',4],['hub_proof',5],['minimum-experiment',6]],
   branches:[]},
 write:{title:'写作与调研线',color:'var(--write)',
   sub:'费曼源码机制调研与文章三分支表达，统一过一次保真去 AI 味。',
   when:'写分享/观点/专栏、做机制调研报告或信息图。',
   nodes:[['sansi',1],['feynman',2],['writing-craft',3],['haohao-eval',4],['haohao',5],['infographic',6]],
   branches:[]},
 util:{title:'工具与库治理线',color:'var(--util)',
   sub:'不绑特定项目的日常效率工具与技能库静态/双模治理。',
   when:'压图、看视频、早报、个人档案存取或技能库体检。',
   nodes:[['png',1],['video',2],['briefing',3],['me-context',4],['skill-library-keeper',5]],
   branches:[]}
};

function roleOf(id){return (DET[id]&&DET[id][0])||'';}
function lineRow(id,idx,branch){
  const x=N[id];if(!x)return '';
  const num=branch?'旁':idx;
  return `<div class="lg-row ${branch?'branch':''}" onclick="detail(N['${id}'])">
    <div class="lg-idx" style="background:${branch?'#fff':PAL[x.c][0]};color:${branch?'#8b95a0':'#fff'};border-color:${PAL[x.c][0]}">${num}</div>
    <div><b>${x.label}</b><span>${branch===true?(LINE_GUIDE[activeLine].branches.find(b=>b[0]===id)||[])[1]||roleOf(id):roleOf(id)}</span></div></div>`;
}
function renderLine(f){
  activeLine=f;const g=LINE_GUIDE[f];
  let h=`<span class="close" onclick="goBack()">×</span><h2 style="color:${g.color}">${g.title}</h2>
    <div class="linesub">${g.sub}</div>
    <div class="k">何时走这条线</div><div class="g">${g.when}</div>
    <div class="k">链上技能（点击看四维详情）</div>
    <div>${g.nodes.map(r=>lineRow(r[0],r[1],false)).join('')}${g.branches.map(r=>lineRow(r[0],0,true)).join('')}</div>`;
  aside(h);
}
function goBack(){if(activeLine)renderLine(activeLine);else home();}
function detail(x){
  if(x.d===0){aside(`<h2>${x.label}</h2><p>一类真实任务入口，顺带子流入对应技能或护栏。</p>`);return;}
  if(x.d===4){aside(`<h2>${x.label}</h2><p>技能交付成果汇总点。</p>`);return;}
  const d=DET[x.id]||['','','',''];
  let h=`<span class="close" onclick="goBack()">×</span><h2>${x.label}</h2>`;
  h+=`<span class="tag t-${x.c}">${CN[x.c]}</span>`;
  if(d[0])h+=`<p>${d[0]}</p><div class="k">独立收益</div><div class="g">${d[1]}</div>
    <div class="k">做对信号</div><div class="g good">✓ ${d[2]}</div><div class="k">翻车信号</div><div class="g bad">✗ ${d[3]}</div>`;
  aside(h);
}
function aside(h){document.getElementById('aside').innerHTML=h;}
function home(){
  activeLine=null;
  const meta={prod:'0→1 孵化设计',eng:'全周期编码与门禁',think:'决策与核真',write:'写作调研出图',util:'工具与治理'};
  const lines=['prod','eng','think','write','util'].map(f=>
   `<button class="lg-line" onclick="pickLine('${f}')"><i class="dot" style="background:${PAL[f][0]}"></i><b>${LINE_GUIDE[f].title}</b><span class="meta">${meta[f]}</span></button>`).join('');
  aside(`<div class="hint"><b>全库 30 技能流向总览</b><br>· 左列为真实工作口语场景，右列为验证与交付产出。<br>· <b>悬停</b>任意节点高亮整条上下游，<b>点击</b>查看好坏信号与边界。<div class="k">五条主线速览</div>${lines}</div>`);
}
function pickLine(f){document.querySelector('.chip[data-f="'+f+'"]').click();}
document.getElementById('filters').addEventListener('click',e=>{
  const chip=e.target.closest('.chip');if(!chip)return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c===chip));
  const f=chip.dataset.f;
  document.querySelectorAll('.node').forEach(g=>{
    const mine=f==='all'||g.dataset.c===f||g.dataset.c==='src'||g.dataset.c==='res';
    g.classList.toggle('dim',!mine);
  });
  flowEls.forEach(p=>{
    const mine=f==='all'||p.dataset.c===f;
    p.classList.toggle('muted',!mine);
    p.style.fill=(f==='all')?'':(PAL[f]?.[0]||'');
  });
  if(f==='all')home();else renderLine(f);
});
if(new URLSearchParams(location.search).get('print')==='1')document.body.classList.add('print');
home();
</script>
</body>
