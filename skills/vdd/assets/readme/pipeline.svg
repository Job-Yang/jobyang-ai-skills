<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1120" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="640" height="1120" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#2b2b2b">VDD：说「完成」之前，先自证一遍</text>

  <!-- 被否掉的做法 -->
  <g font-size="12.5" fill="#6b7280">
    <rect x="40" y="72" width="262" height="62" rx="8" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="171" y="98" text-anchor="middle" font-weight="600">顺着原思路再查一遍</text>
    <text x="171" y="118" text-anchor="middle" font-size="11">不是验证，是又背书一次</text>

    <rect x="338" y="72" width="262" height="62" rx="8" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="469" y="98" text-anchor="middle" font-weight="600">开放式找茬</text>
    <text x="469" y="118" text-anchor="middle" font-size="11">「必须找出问题」一定挤得出问题</text>
  </g>

  <!-- 第一部分：单次自证三步 -->
  <text x="320" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#0b3b36">第一部分 · 单次自证</text>
  <g font-size="13.5" fill="#0b3b36">
    <rect x="170" y="180" width="300" height="60" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="206" text-anchor="middle" font-weight="600">① 扒一遍前提</text>
    <text x="320" y="226" text-anchor="middle" font-size="11" fill="#3d6b66">藏着的假设成立吗？缺什么信息？</text>

    <rect x="170" y="284" width="300" height="60" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="310" text-anchor="middle" font-weight="600">② 每个动作给理由和证据</text>
    <text x="320" y="330" text-anchor="middle" font-size="11" fill="#3d6b66">改了什么 / 什么没改，都要证据</text>

    <rect x="170" y="388" width="300" height="60" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="414" text-anchor="middle" font-weight="600">③ 过四道关卡才算完成</text>
    <text x="320" y="434" text-anchor="middle" font-size="11" fill="#3d6b66">时间/范围/机制/反证，缺一不算</text>
  </g>
  <g stroke="#0f9d8f" stroke-width="2.2" fill="#0f9d8f">
    <line x1="320" y1="240" x2="320" y2="274"/><polygon points="320,284 315,274 325,274"/>
    <line x1="320" y1="344" x2="320" y2="378"/><polygon points="320,388 315,378 325,378"/>
  </g>

  <!-- 琥珀：换身份 -->
  <g font-size="12.5" fill="#7a5410">
    <line x1="470" y1="314" x2="516" y2="314" stroke="#e8a33d" stroke-width="2"/>
    <rect x="516" y="282" width="108" height="66" rx="8" fill="#fdf1dd" stroke="#e8a33d" stroke-width="2"/>
    <text x="570" y="308" text-anchor="middle" font-weight="600">换身份验</text>
    <text x="570" y="327" text-anchor="middle" font-size="10.5">当第一次看产物</text>
    <text x="570" y="341" text-anchor="middle" font-size="10.5">的验收者</text>
  </g>

  <!-- 第二部分：尺子 -->
  <text x="320" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#0b3b36">第二部分 · 防漂移：先立尺子，再对照裁决</text>
  <g font-size="12.5" fill="#0b3b36">
    <rect x="120" y="516" width="400" height="58" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="1.8"/>
    <text x="320" y="540" text-anchor="middle" font-weight="600">尺子三层：系统底线 → 任务契约 → 单次验收</text>
    <text x="320" y="560" text-anchor="middle" font-size="11" fill="#3d6b66">越上层越不因一句临时的话动摇</text>

    <rect x="120" y="596" width="400" height="58" rx="8" fill="#fdf1dd" stroke="#e8a33d" stroke-width="1.8"/>
    <text x="320" y="620" text-anchor="middle" font-weight="600" fill="#7a5410">三种裁决：符合就说不用改 / 偏离给证据改回 / 尺子没覆盖先拍板</text>
    <text x="320" y="640" text-anchor="middle" font-size="11" fill="#8a6420">每条「问题」必须对应尺子某条，否则不硬改</text>
  </g>

  <!-- 注记 -->
  <g>
    <rect x="60" y="700" width="520" height="110" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="1.5"/>
    <text x="320" y="728" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b3b36">效力来自方法本身，不靠外部架子</text>
    <text x="320" y="754" text-anchor="middle" font-size="12" fill="#3d6b66">报喜是讨好，硬挤问题也是讨好；两个方向都治</text>
    <text x="320" y="776" text-anchor="middle" font-size="12" fill="#3d6b66">敢说「做成了」也敢说「没成」，该说没问题时不硬找问题</text>
    <text x="320" y="798" text-anchor="middle" font-size="11" fill="#8a6420">目标不是让用户此刻高兴，是让用户以后敢信你</text>
  </g>

  <!-- 图例 -->
  <g font-size="12" fill="#4b5563">
    <rect x="60" y="1050" width="16" height="16" rx="3" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="1.5"/>
    <text x="82" y="1063">方法主干</text>
    <rect x="180" y="1050" width="16" height="16" rx="3" fill="#fdf1dd" stroke="#e8a33d" stroke-width="1.5"/>
    <text x="202" y="1063">关键机关</text>
    <rect x="320" y="1050" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="342" y="1063">被否掉的做法</text>
  </g>
</svg>
