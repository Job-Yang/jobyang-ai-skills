# Style Compass — 风格坐标库 (Style Coordinate Library)
#
# 设计原则:
#   archetype 与 render_hint 用来传递构图、密度、层次和动效等整体语义。
#   颜色、字号等精确 token 只在用户选定方向后生成，用于跨屏和跨平台一致性。
#   本库不提供可以直接套用的固定视觉参数，避免把不同方向压成同一种模板。
#
# 字段约定:
#   id            唯一标识
#   name          中文人话名
#   archetypes    代表产品——**这是最重要的字段**,渲染时直接点名,调动模型的全部理解
#   mood          3-5 个情绪词(问诊匹配用)
#   best_for      适合场景
#   avoid_for     不适合场景(帮用户排除)
#   one_liner     一句话气质,选样时念给用户听
#   render_hint   ⭐ 喂给模型的渲染指令:精髓 + 该做什么 + 明确禁用什么(反 slop)
#                 注意:描述的是"手艺和感觉",不是硬编码数值。留白/密度/层次这类才是精髓。

version: 2

coordinates:

  - id: calm-tech
    name: 克制工程感
    archetypes: [Linear, Vercel, Height, Raycast]
    mood: [专业, 冷静, 高效, 锋利]
    best_for: [开发者工具, 内部后台, 数据密集型仪表盘, B 端 SaaS]
    avoid_for: [儿童产品, 情感化营销页, 电商大促]
    one_liner: "像 Linear:安静、锋利、给专业用户的高密度工具感,深色为主、几乎不喧哗。"
    render_hint: >
      参考 Linear / Vercel 那种"克制、精确、工程感"的美学,调动你对这类产品的全部理解自由发挥。
      精髓在:单面板 + 发丝级分割线(而非一堆独立卡片)、信息密度高但透气、强弱字重拉开层次、
      状态用极小的圆点/标签而非花哨徽章、一个克制的冷色强调(靛蓝一类)、快速而几乎无感的过渡。
      深色背景用近黑而非纯黑。禁止:紫白渐变、圆润卡通、多彩强调色堆叠、大圆角、弹跳动画、
      Inter/Roboto 当主视觉字体、教科书式的"卡片+阴影+药丸徽章"默认后台样式。

  - id: warm-clarity
    name: 温暖清爽
    archetypes: [Things 3, Craft, Bear, Cron]
    mood: [温暖, 清爽, 亲和, 有条理]
    best_for: [效率工具, 笔记/待办, 个人生产力 App, 轻量消费级]
    avoid_for: [硬核数据平台, 金融交易终端, 强企业感后台]
    one_liner: "像 Things 3:干净留白、暖调中性、亲切但不幼稚,让人愿意每天打开。"
    render_hint: >
      参考 Things 3 / Craft 那种"温暖清爽、亲切有序"的美学自由发挥。
      精髓在:充足而讲究的留白、暖白背景(不是刺眼纯白)、柔和克制的强调色、圆润但不夸张的圆角、
      轻柔的缓动、清晰的分组与呼吸感。亲切但保持成熟,不要幼态。
      禁止:冷硬深色、高饱和荧光色、密不透风的表格、生硬直角、廉价渐变。

  - id: neutral-flexible
    name: 中性灵活
    archetypes: [Notion, Coda, Slite]
    mood: [中性, 克制, 灵活, 内容优先]
    best_for: [内容平台, 文档/知识库, 混合型工作台, 长期扩展的产品]
    avoid_for: [需要强品牌记忆点的营销页, 情绪化娱乐产品]
    one_liner: "像 Notion:近乎无风格的风格,黑白灰为主、内容说话,极易扩展。"
    render_hint: >
      参考 Notion / Coda 那种"中性、内容优先"的美学自由发挥。
      精髓在:黑白灰基调让内容当主角、克制到近乎隐形的 UI、标题可用衬线制造一点气质、
      极简的分隔和留白、强调色近乎黑而不抢戏。
      禁止:抢戏的品牌色、渐变、重阴影、花哨图标、过度动效。

  - id: playful-gamified
    name: 活泼游戏化
    archetypes: [Duolingo, Cash App, Headspace(部分)]
    mood: [活泼, 友好, 有奖励感, 大胆]
    best_for: [教育/学习, 习惯养成, 大众消费级, 面向年轻用户]
    avoid_for: [企业后台, 金融/医疗严肃场景, 专业工具]
    one_liner: "像 Duolingo:高饱和大色块、圆润可爱、强反馈奖励感,情绪拉满、鼓励点击。"
    render_hint: >
      参考 Duolingo 那种"活泼、友好、有奖励感"的美学自由发挥。
      精髓在:高饱和主色大方使用、大圆角、厚实的按钮(带底边的 3D 立体感)、明确的进度/成功反馈、
      大字重标题、适度的弹跳动效带来愉悦感。
      禁止:冷淡灰阶、密集信息、锐利直角、无反馈的静态交互、严肃衬线体。

  - id: editorial
    name: 编辑杂志感
    archetypes: [Readwise, Medium, Substack]
    mood: [文雅, 有序, 阅读友好, 有观点]
    best_for: [阅读类, 内容/博客, 知识付费, 品牌官网, 长文本]
    avoid_for: [高频操作后台, 数据仪表盘, 交易类工具]
    one_liner: "像 Medium:衬线大标题、宽松行距、以排版为主角,像一本讲究的杂志。"
    render_hint: >
      参考 Medium / Readwise 那种"编辑杂志感"的美学自由发挥。
      精髓在:讲究的衬线大标题、宽松行距、受控的正文测量宽度(每行 45-75 字符最舒服)、
      印刷感的强调色、近乎直角、克制到几乎没有的动效——让文字排版当绝对主角。
      禁止:无衬线堆砌、卡片密铺、荧光色、圆润按钮、抢戏的交互动画。

  - id: minimal-zen
    name: 极简禅意
    archetypes: [Apple, Teenage Engineering, 无印良品]
    mood: [极简, 高级, 留白, 精确]
    best_for: [高端硬件/消费电子, 精品工具, 品牌展示, 摄影/设计类]
    avoid_for: [信息密集后台, 预算有限的快速原型, 需要热闹氛围的场景]
    one_liner: "像 Apple:大量留白、极少元素、每个像素都克制,靠精确和呼吸感显高级。"
    render_hint: >
      参考 Apple / 无印良品 那种"极简禅意、高级克制"的美学自由发挥。
      精髓在:大量留白当设计语言、元素极少但每个都精确对齐、单一克制的强调色、
      高质量的呼吸感、丝滑而低调的缓动。少即是多。
      禁止:信息塞满、多色强调、边框噪声、廉价渐变、生硬动画、装饰性图标。

  - id: bold-expressive
    name: 大胆潮流
    archetypes: [Gumroad(新), Figma 品牌页, Framer]
    mood: [大胆, 潮流, 有态度, 高对比]
    best_for: [面向创作者/开发者的营销页, 新锐品牌, 落地页, 作品集]
    avoid_for: [严肃后台, 医疗/金融, 长时间使用的生产力工具]
    one_liner: "像新版 Gumroad:大色块高对比、超大字号、粗黑边框,张扬有态度、第一眼抓人。"
    render_hint: >
      参考新版 Gumroad / Framer 品牌页那种"大胆、有态度、高对比"的美学自由发挥。
      精髓在:超大标题字号制造冲击、粗黑边框和硬投影(offset shadow)、大胆撞色块、
      近乎直角、干脆利落不拖泥带水的动效。要张扬、要有记忆点。
      禁止:柔弱灰阶、细边框、低对比、优雅渐变过渡、缩手缩脚的留白、优雅衬线。

  - id: soft-wellness
    name: 柔和疗愈
    archetypes: [Calm, Headspace, Oak]
    mood: [平静, 疗愈, 柔和, 安心]
    best_for: [健康/冥想, 睡眠/情绪, 医疗关怀, 女性向消费级]
    avoid_for: [硬核工具, 高效率后台, 高对比营销页]
    one_liner: "像 Calm:低饱和渐变、柔光氛围、圆润无棱角,让人放松下来、慢下来。"
    render_hint: >
      参考 Calm / Headspace 那种"柔和疗愈、平静安心"的美学自由发挥。
      精髓在:低饱和柔色、柔光渐变营造氛围(这里的渐变是加分项,和 slop 的紫渐变不同——要低饱和、有意境)、
      大圆角无棱角、缓慢漂浮的动效、充足的呼吸空间。让人慢下来。
      禁止:高对比撞色、锐利直角、密集信息、快速生硬动画、冷硬深色。
