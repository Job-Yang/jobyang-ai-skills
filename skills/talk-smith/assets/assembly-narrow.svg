<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1040" viewBox="0 0 390 1040" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Source Han Sans SC, sans-serif">
  <rect width="390" height="1040" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#2b2b2b">talk-smith 是装配者</text>
  <text x="20" y="50" font-size="11.5" fill="#666666">青绿＝主流水线　琥珀＝基准校准　灰虚＝不接的活</text>

  <rect x="20" y="66" width="350" height="70" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="1.8"/>
  <text x="36" y="90" font-size="13" font-weight="600" fill="#1f5f58">上游：feynman-explainer</text>
  <text x="36" y="110" font-size="11.5" fill="#333333">调研仓库/源码/论文的结论先吃它的，</text>
  <text x="36" y="127" font-size="11" fill="#555555">成稿时只补新缺口，不重复调研</text>

  <g stroke="#555555" stroke-width="1.5" fill="#555555">
    <line x1="195" y1="136" x2="195" y2="160"/><polygon points="195,163 191,156 199,156"/>
  </g>

  <rect x="20" y="166" width="350" height="60" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="2"/>
  <text x="36" y="190" font-size="13" font-weight="600" fill="#1f5f58">① 选题访谈</text>
  <text x="36" y="210" font-size="11.5" fill="#333333">讲给谁、一句话主线、article/talk/slides</text>

  <rect x="20" y="236" width="350" height="60" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="2"/>
  <text x="36" y="260" font-size="13" font-weight="600" fill="#1f5f58">② 技术核实</text>
  <text x="36" y="280" font-size="11.5" fill="#333333">术语原词、数字带出处；不过核实不进叙事</text>

  <rect x="20" y="306" width="350" height="60" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="2"/>
  <text x="36" y="330" font-size="13" font-weight="600" fill="#1f5f58">③ 叙事弧大纲</text>
  <text x="36" y="350" font-size="11.5" fill="#333333">八拍推进链，先给大纲，确认再填正文</text>

  <rect x="20" y="376" width="350" height="60" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="2"/>
  <text x="36" y="400" font-size="13" font-weight="600" fill="#1f5f58">④ 分态产出</text>
  <text x="36" y="420" font-size="11.5" fill="#333333">中长文 / talk / slides，同一内核三态互转</text>

  <rect x="20" y="446" width="350" height="60" rx="9" fill="#2a9d8f" stroke="#1f5f58" stroke-width="2"/>
  <text x="36" y="470" font-size="13" font-weight="600" fill="#ffffff">⑤ 质检硬闸</text>
  <text x="36" y="490" font-size="11.5" fill="#dff3f0">五维评分低于线重写；talk_check.py 真跑</text>

  <rect x="20" y="528" width="350" height="54" rx="8" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="36" y="550" font-size="12" font-weight="600" fill="#1f5f58">content-infographic：传播型封面/对比图</text>
  <text x="36" y="569" font-size="11" fill="#333333">帮读者记，锚定正文那一节</text>

  <rect x="20" y="590" width="350" height="54" rx="8" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="36" y="612" font-size="12" font-weight="600" fill="#1f5f58">engineering-docs：精确架构/时序图</text>
  <text x="36" y="631" font-size="11" fill="#333333">要评审才出，直观版不替代严谨版</text>

  <rect x="20" y="652" width="350" height="54" rx="8" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.4"/>
  <text x="36" y="674" font-size="12" font-weight="600" fill="#1f5f58">haohao-shuohua：定稿重档去 AI 味</text>
  <text x="36" y="693" font-size="11" fill="#333333">判定线以它为准，它不反向调用本技能</text>

  <rect x="20" y="714" width="350" height="54" rx="8" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="36" y="736" font-size="12" font-weight="600" fill="#1f5f58">sansi-erhouxing：只在改既有稿时先过它</text>
  <text x="36" y="755" font-size="11" fill="#333333">从零起稿可跳过</text>

  <rect x="20" y="790" width="350" height="80" rx="9" fill="#fbf1d6" stroke="#d9a441" stroke-width="1.6"/>
  <text x="36" y="814" font-size="12.5" font-weight="600" fill="#7a5a12">基准校准一：风格样本换过</text>
  <text x="36" y="834" font-size="11.5" fill="#333333">最初拿 8 篇成稿定规（疑似含 AI 改写稿），</text>
  <text x="36" y="852" font-size="11.5" fill="#333333">后切到作者本人打磨的真实稿，删疑似 AI 外壳</text>

  <rect x="20" y="886" width="350" height="80" rx="9" fill="#fbf1d6" stroke="#d9a441" stroke-width="1.6"/>
  <text x="36" y="910" font-size="12.5" font-weight="600" fill="#7a5a12">基准校准二：裁决轴换过</text>
  <text x="36" y="930" font-size="11.5" fill="#333333">从「对内/对外」改为「要不要面向读者做</text>
  <text x="36" y="948" font-size="11.5" fill="#333333">有叙事、有人味的传播」——对内 talk 也归它</text>

  <rect x="20" y="982" width="350" height="44" rx="9" fill="#f4f5f6" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="1002" font-size="11" fill="#5f6368">不接：短观点硬文、未来畅想、要评审的 RFC、</text>
  <text x="36" y="1018" font-size="11" fill="#5f6368">只想自己搞懂的调研、三句话能讲清的答疑</text>
</svg>
