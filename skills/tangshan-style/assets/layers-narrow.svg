<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1080" viewBox="0 0 390 1080" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Source Han Sans SC, sans-serif">
  <rect width="390" height="1080" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="600" fill="#2b2b2b">五层过滤器：炼句为主角</text>
  <text x="20" y="50" font-size="11.5" fill="#666666">青绿＝流水线　琥珀＝盲评返工　灰虚＝不接的活</text>

  <rect x="20" y="66" width="350" height="74" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="1.6"/>
  <text x="36" y="90" font-size="12.5" font-weight="600" fill="#1f5f58">引不是洗稿</text>
  <text x="36" y="109" font-size="11.5" fill="#333333">逆向拆解汤山老王 3 个视频逐字稿加 8 篇文章，</text>
  <text x="36" y="126" font-size="11.5" fill="#333333">偷镜头和炼句法，燃料是自己的一线经验，不抄财经观点</text>

  <g stroke="#555555" stroke-width="1.5" fill="#555555">
    <line x1="195" y1="140" x2="195" y2="162"/><polygon points="195,165 191,158 199,158"/>
  </g>

  <rect x="20" y="168" width="350" height="56" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="2"/>
  <text x="36" y="190" font-size="13" font-weight="600" fill="#1f5f58">① 选题层</text>
  <text x="36" y="210" font-size="11.5" fill="#333333">6 个内核当镜头，找反直觉角度切</text>

  <rect x="20" y="234" width="350" height="56" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="2"/>
  <text x="36" y="256" font-size="13" font-weight="600" fill="#1f5f58">② 结构层</text>
  <text x="36" y="276" font-size="11.5" fill="#333333">发动机 5 段：具身开头到反问收束</text>

  <rect x="20" y="300" width="350" height="56" rx="9" fill="#2a9d8f" stroke="#1f5f58" stroke-width="2"/>
  <text x="36" y="322" font-size="13" font-weight="600" fill="#ffffff">③ 句子层：炼句 8 法（重心）</text>
  <text x="36" y="342" font-size="11.5" fill="#dff3f0">对仗、见血动词、顶真、造词、长铺短锤、镜像金句</text>

  <rect x="20" y="366" width="350" height="66" rx="9" fill="#fbf1d6" stroke="#d9a441" stroke-width="2"/>
  <text x="36" y="390" font-size="13" font-weight="600" fill="#7a5a12">④ 保真层（技术文强制）</text>
  <text x="36" y="410" font-size="11.5" fill="#333333">机制先讲全再上比喻；炼句和保真打架</text>
  <text x="36" y="426" font-size="11.5" fill="#333333">先保真——不然机制没了只剩比喻</text>

  <rect x="20" y="442" width="350" height="56" rx="9" fill="#e6f4f2" stroke="#2a9d8f" stroke-width="2"/>
  <text x="36" y="464" font-size="13" font-weight="600" fill="#1f5f58">⑤ 质检层</text>
  <text x="36" y="484" font-size="11.5" fill="#333333">口水话红线 9 条加保真红线 A 到 E</text>

  <rect x="20" y="526" width="350" height="128" rx="9" fill="#fbf1d6" stroke="#d9a441" stroke-width="1.8"/>
  <text x="36" y="550" font-size="12.5" font-weight="600" fill="#7a5a12">剂量闸是盲评返工打出来的</text>
  <text x="36" y="572" font-size="11.5" fill="#333333">A/B 实测新版输了：自报只用 6 法，</text>
  <text x="36" y="590" font-size="11.5" fill="#333333">裁判从宽数出 13 处、10 段，破贴线闸；</text>
  <text x="36" y="608" font-size="11.5" fill="#333333">只有 1 处平地句、尾部三段连环锤、</text>
  <text x="36" y="626" font-size="11.5" fill="#333333">最后两段连用反问，被判「更炸但更油滑」。</text>
  <text x="36" y="644" font-size="11" fill="#7a5a12">返工：从宽计数写出、总数压到段落数 2/3、平地句至少 3 处</text>

  <rect x="20" y="676" width="350" height="112" rx="9" fill="#f4f5f6" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="36" y="700" font-size="12" fill="#5f6368">不接的活</text>
  <text x="36" y="722" font-size="11.5" fill="#5f6368">当下就能被反驳的硬判断走 cuihuo；</text>
  <text x="36" y="740" font-size="11.5" fill="#5f6368">调研搞懂一个原理走 feynman-explainer；</text>
  <text x="36" y="758" font-size="11.5" fill="#5f6368">面向读者的分享走 talk-smith。</text>
  <text x="36" y="780" font-size="11" fill="#8a8f94">判断句式：现在是怎样（淬火），还是未来会怎样（汤山）</text>
</svg>
