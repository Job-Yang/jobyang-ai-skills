<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1240" viewBox="0 0 880 1240" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect width="880" height="1240" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="600" fill="#262b33">最小实验：用一次低成本可逆试错，替代反复空想</text>
  <text x="40" y="86" font-size="15" fill="#5b6470">方法来自精益构建-测量-学习循环、波普尔可证伪性与工程探针</text>

  <rect x="40" y="120" width="800" height="72" rx="12" fill="#ffffff" stroke="#0f8a6d" stroke-width="1.8"/>
  <text x="64" y="150" font-size="18" font-weight="600" fill="#0b6b55">触发：想法停在纸面推演，讨论再久也不收敛</text>
  <text x="64" y="176" font-size="14.5" fill="#0b6b55">查得到的事实先查（价格/政策/规范），别拿实验代替查资料</text>

  <line x1="440" y1="192" x2="440" y2="224" stroke="#0f8a6d" stroke-width="2.5" marker-end="url(#t)"/>

  <rect x="40" y="224" width="800" height="104" rx="12" fill="#e6f4f0" stroke="#0f8a6d" stroke-width="2"/>
  <text x="64" y="256" font-size="18" font-weight="600" fill="#0b6b55">① 摊开所有假设，写成可证伪陈述句</text>
  <text x="64" y="284" font-size="14.5" fill="#0b6b55">价值假设（用户真有这问题吗）· 可行性假设（做得出吗）· 关键前提</text>
  <text x="64" y="308" font-size="14.5" fill="#0b6b55">格式：X 在 Y 条件下会发生 Z；不写「也许可能大概」</text>

  <line x1="440" y1="328" x2="440" y2="360" stroke="#0f8a6d" stroke-width="2.5" marker-end="url(#t)"/>

  <rect x="40" y="360" width="800" height="92" rx="12" fill="#e6f4f0" stroke="#0f8a6d" stroke-width="2"/>
  <text x="64" y="392" font-size="18" font-weight="600" fill="#0b6b55">② 按关键性 × 不确定性，只选一个最致命的</text>
  <text x="64" y="420" font-size="14.5" fill="#0b6b55">一次只打一个假设；塞进五个，失败时分不清是谁错</text>

  <line x1="440" y1="452" x2="440" y2="484" stroke="#0f8a6d" stroke-width="2.5" marker-end="url(#t)"/>

  <rect x="40" y="484" width="800" height="140" rx="12" fill="#e6f4f0" stroke="#0f8a6d" stroke-width="2"/>
  <text x="64" y="516" font-size="18" font-weight="600" fill="#0b6b55">③ 设计最小实验（八要素）</text>
  <text x="64" y="544" font-size="14.5" fill="#0b6b55">做什么 · 投入上限 · 观察指标（可决策，不是虚荣指标）</text>
  <text x="64" y="568" font-size="14.5" fill="#0b6b55">继续信号阈值 · 停止/转向信号阈值 · 时间盒</text>
  <text x="64" y="592" font-size="14.5" fill="#0b6b55">可逆性 · 无论成败这次能学到什么新信息</text>
  <text x="64" y="616" font-size="13.5" fill="#0b6b55">能手动就不写系统、能假数据就不接真接口</text>

  <line x1="440" y1="624" x2="440" y2="656" stroke="#0f8a6d" stroke-width="2.5" marker-end="url(#t)"/>

  <rect x="40" y="656" width="800" height="76" rx="12" fill="#ffffff" stroke="#0f8a6d" stroke-width="1.8"/>
  <text x="64" y="686" font-size="18" font-weight="600" fill="#0b6b55">④ 给出明天的第一个动作</text>
  <text x="64" y="712" font-size="14.5" fill="#0b6b55">把启动成本降到最低；到时间盒收口判读，不许无限拖</text>

  <rect x="40" y="760" width="800" height="128" rx="12" fill="#fbf0dd" stroke="#c97a16" stroke-width="1.8"/>
  <text x="64" y="792" font-size="17" font-weight="600" fill="#9a5a0e">写死的纪律</text>
  <text x="64" y="820" font-size="14" fill="#9a5a0e">阈值先行：继续/停止标准实验前写死，禁止看完结果再挪线。</text>
  <text x="64" y="844" font-size="14" fill="#9a5a0e">实验必须可证伪：怎么解释都算「还行」的实验是无效实验。</text>
  <text x="64" y="868" font-size="14" fill="#9a5a0e">到了停止阈值就停，失败也是有效信息；样本小就如实标注结论强度。</text>

  <rect x="40" y="916" width="800" height="140" rx="12" fill="#f4f6f8" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="64" y="948" font-size="16" font-weight="600" fill="#5b6470">成熟度与待补</text>
  <text x="64" y="976" font-size="14" fill="#5b6470">2026-10-21 随思维技能批次创建，目前「已建待盲测」：</text>
  <text x="64" y="1000" font-size="14" fill="#5b6470">触发盲测、端到端样本、对抗软肋三关未跑，不夸已成熟。</text>
  <text x="64" y="1024" font-size="14" fill="#5b6470">技术探针与产品实验共用一套流程的取舍依据，待作者补。</text>

  <defs>
    <marker id="t" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f8a6d"/></marker>
  </defs>
</svg>
