<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1080" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="640" height="1080" fill="#ffffff"/>
  <text x="320" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#2b2b2b">反向拆解：从「觉得好」到可搬走的规律</text>

  <!-- 被否掉的做法 -->
  <g font-size="12.5" fill="#6b7280">
    <rect x="40" y="72" width="262" height="62" rx="8" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="171" y="98" text-anchor="middle" font-weight="600">夸夸体 / 特征罗列</text>
    <text x="171" y="118" text-anchor="middle" font-size="11">「高级惊艳」不是拆解</text>

    <rect x="338" y="72" width="262" height="62" rx="8" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="469" y="98" text-anchor="middle" font-weight="600">据名气二手转述开工</text>
    <text x="469" y="118" text-anchor="middle" font-size="11">不接触成品本身就不拆</text>
  </g>

  <!-- 主路径六步 -->
  <text x="320" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#0b3b36">六步流程，前一步喂给后一步</text>
  <g font-size="13" fill="#0b3b36">
    <rect x="150" y="182" width="340" height="52" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="205" text-anchor="middle" font-weight="600">1 一句话问题</text>
    <text x="320" y="224" text-anchor="middle" font-size="11" fill="#3d6b66">它为谁、什么场景、解决什么</text>

    <rect x="150" y="262" width="340" height="52" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="285" text-anchor="middle" font-weight="600">2 还原结构与流程</text>
    <text x="320" y="304" text-anchor="middle" font-size="11" fill="#3d6b66">只写观察到的，看不到的标推测</text>

    <rect x="150" y="342" width="340" height="52" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="365" text-anchor="middle" font-weight="600">3 关键选择三层追问</text>
    <text x="320" y="384" text-anchor="middle" font-size="11" fill="#3d6b66">替代什么 / 解掉什么 / 付出什么代价</text>

    <rect x="150" y="422" width="340" height="52" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="445" text-anchor="middle" font-weight="600">4 分两堆：可迁移 vs 仅本案</text>
    <text x="320" y="464" text-anchor="middle" font-size="11" fill="#3d6b66">前提还在吗？什么条件下搬了会翻车</text>

    <rect x="150" y="502" width="340" height="52" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="525" text-anchor="middle" font-weight="600">5 提炼 3–5 条规律</text>
    <text x="320" y="544" text-anchor="middle" font-size="11" fill="#3d6b66">有机制、可操作，不写正确废话</text>

    <rect x="150" y="582" width="340" height="52" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="2"/>
    <text x="320" y="605" text-anchor="middle" font-weight="600">6 操作清单 + 一个最小练习</text>
    <text x="320" y="624" text-anchor="middle" font-size="11" fill="#3d6b66">带继续/停止信号</text>
  </g>
  <g stroke="#0f9d8f" stroke-width="2" fill="#0f9d8f">
    <line x1="320" y1="234" x2="320" y2="252"/><polygon points="320,262 316,253 324,253"/>
    <line x1="320" y1="314" x2="320" y2="332"/><polygon points="320,342 316,333 324,333"/>
    <line x1="320" y1="394" x2="320" y2="412"/><polygon points="320,422 316,413 324,413"/>
    <line x1="320" y1="474" x2="320" y2="492"/><polygon points="320,502 316,493 324,493"/>
    <line x1="320" y1="554" x2="320" y2="572"/><polygon points="320,582 316,573 324,573"/>
  </g>

  <!-- 琥珀：核心机关 -->
  <g font-size="12.5" fill="#7a5410">
    <rect x="120" y="680" width="400" height="80" rx="8" fill="#fdf1dd" stroke="#e8a33d" stroke-width="2"/>
    <text x="320" y="706" text-anchor="middle" font-weight="600">最严重的错误：把「仅适用本案」误报成可迁移</text>
    <text x="320" y="728" text-anchor="middle" font-size="11.5">拿不准就多划几条进本案堆；说不出代价说明没拆到位</text>
    <text x="320" y="748" text-anchor="middle" font-size="11.5">单样本纪律：不能从一个对象得出「行业都该这样」</text>
  </g>

  <!-- 注记 -->
  <g>
    <rect x="60" y="810" width="520" height="100" rx="8" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="1.5"/>
    <text x="320" y="838" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b3b36">输入是具体成品，输出是面向你处境的结论</text>
    <text x="320" y="864" text-anchor="middle" font-size="12" fill="#3d6b66">它不评价好坏本身，不复述内容，不产出百科</text>
    <text x="320" y="886" text-anchor="middle" font-size="11" fill="#8a6420">看完不知道下一步干嘛，视为本次失败</text>
  </g>

  <!-- 图例 -->
  <g font-size="12" fill="#4b5563">
    <rect x="60" y="1010" width="16" height="16" rx="3" fill="#e6f5f3" stroke="#0f9d8f" stroke-width="1.5"/>
    <text x="82" y="1023">拆解流程</text>
    <rect x="190" y="1010" width="16" height="16" rx="3" fill="#fdf1dd" stroke="#e8a33d" stroke-width="1.5"/>
    <text x="212" y="1023">核心机关</text>
    <rect x="330" y="1010" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="352" y="1023">被禁止的做法</text>
  </g>
</svg>
