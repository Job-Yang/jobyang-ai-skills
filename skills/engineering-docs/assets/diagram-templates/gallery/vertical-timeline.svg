<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1020" viewBox="0 0 680 1020" role="img"><title>一次故障的处置时间线</title><desc>间隔按分钟比例绘制；事件描述不等于因果判断。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="white"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">垂直时间线</text><text x="32" y="74.0" font-size="26" fill="#1F2329" font-weight="600" text-anchor="start">一次故障的处置时间线</text><text x="32" y="105.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">纵轴为起点后的分钟数 · 时间从上向下</text><path d="M340 172 V842" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="32" y="147.0" width="276" height="108" rx="8" fill="#EAE2FE" stroke="#7456B2" stroke-width="1.2"/><text x="44" y="172.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">00 分 · 告警触发</text><text x="44" y="198.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">错误率超过阈值</text><path d="M340 172.0 H308" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="340" cy="172.0" r="5" fill="#EAE2FE" stroke="#7456B2"/><rect x="372" y="258.66666666666663" width="276" height="108" rx="8" fill="#DFF5E5" stroke="#367747" stroke-width="1.2"/><text x="384" y="283.66666666666663" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">05 分 · 确认影响</text><text x="384" y="309.66666666666663" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">读请求出现超时</text><path d="M340 283.66666666666663 H372" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="340" cy="283.66666666666663" r="5" fill="#DFF5E5" stroke="#367747"/><rect x="32" y="415.0" width="276" height="108" rx="8" fill="#FEF1CE" stroke="#896B21" stroke-width="1.2"/><text x="44" y="440.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">12 分 · 执行回退</text><text x="44" y="466.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">恢复上一版本</text><path d="M340 440.0 H308" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="340" cy="440.0" r="5" fill="#FEF1CE" stroke="#896B21"/><rect x="372" y="593.6666666666666" width="276" height="108" rx="8" fill="#F0F4FC" stroke="#4063A8" stroke-width="1.2"/><text x="384" y="618.6666666666666" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">20 分 · 指标恢复</text><text x="384" y="644.6666666666666" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">继续观察稳定性</text><path d="M340 618.6666666666666 H372" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="340" cy="618.6666666666666" r="5" fill="#F0F4FC" stroke="#4063A8"/><rect x="32" y="817.0" width="276" height="108" rx="8" fill="#FEE3E2" stroke="#AF4643" stroke-width="1.2"/><text x="44" y="842.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">30 分 · 处置结束</text><text x="44" y="868.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">进入根因复盘</text><path d="M340 842.0 H308" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="340" cy="842.0" r="5" fill="#FEE3E2" stroke="#AF4643"/><path d="M32 951 H648" fill="none" stroke="#DEE0E3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="976.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">间隔按分钟比例绘制；事件描述不等于因果判断。</text><text x="32" y="1008.0" font-size="12" fill="#646A73" font-weight="400" text-anchor="start">合成示例 · document-pastel</text></g></svg>
