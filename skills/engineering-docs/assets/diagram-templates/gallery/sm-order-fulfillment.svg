<svg xmlns="http://www.w3.org/2000/svg" width="680" height="444" viewBox="0 0 680 444" role="img"><title>订单支付履约的状态生命周期</title><desc>回退通道在卡片最外侧；迁移标签为事件/条件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5F6670" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">复杂状态机</text><text x="32" y="74.0" font-size="26" fill="#1A1B1C" font-weight="600" text-anchor="start">订单支付履约的状态生命周期</text><text x="32" y="105.0" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">主干一条线 · 失败/超时为短分叉 · 重试走外侧回退通道</text><circle cx="52" cy="239.0" r="13" fill="#1A1B1C"/><rect x="76.0" y="216" width="100" height="46" rx="8" fill="#FAFAF8" stroke="#D6DCE3" stroke-width="1.2"/><text x="126.0" y="244.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">支付处理中</text><rect x="233.33333333333334" y="216" width="100" height="46" rx="8" fill="#FAFAF8" stroke="#D6DCE3" stroke-width="1.2"/><text x="283.33333333333337" y="244.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">已支付</text><rect x="390.6666666666667" y="216" width="100" height="46" rx="8" fill="#FAFAF8" stroke="#D6DCE3" stroke-width="1.2"/><text x="440.6666666666667" y="244.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">履约中</text><rect x="548.0" y="216" width="100" height="46" rx="8" fill="#FAFAF8" stroke="#5F6670" stroke-width="2.0"/><rect x="554.0" y="222" width="88" height="34" rx="6" fill="#FAFAF8" stroke="#5F6670" stroke-width="1.0"/><text x="598.0" y="244.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">已完成</text><rect x="76.0" y="306" width="100" height="46" rx="8" fill="#FAFAF8" stroke="#D6DCE3" stroke-width="1.2"/><text x="126.0" y="334.0"