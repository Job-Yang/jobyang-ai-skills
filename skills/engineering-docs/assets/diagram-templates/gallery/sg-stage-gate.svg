<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img"><title>从需求到交付的三道门禁</title><desc>门禁状态是当前真实结论；未通过即阻断，须修复后重验。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5F6670" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">阶段门图</text><text x="32" y="74.0" font-size="26" fill="#1A1B1C" font-weight="600" text-anchor="start">从需求到交付的三道门禁</text><text x="32" y="105.0" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">横向推进 · 每道门禁标明准入与准出条件</text><rect x="32.0" y="140" width="150" height="86" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="44.0" y="165.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">需求冻结</text><text x="44.0" y="191.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">准入：口径签字</text><text x="44.0" y="209.2" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">准出：基线入库</text><rect x="265.0" y="140" width="150" height="86" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="277.0" y="165.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">联调集成</text><text x="277.0" y="191.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">准入：环境就绪</text><text x="277.0" y="209.2" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">准出：联调通过</text><rect x="498.0" y="140" width="150" height="86" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="510.0" y="165.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">验收交付</text><text x="510.0" y="191.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">准入：用例通过</text><text x="510.0" y="209.2" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">准出：签字交付</text><rect x="203.5" y="159.0" width="40" height="48" rx="19.0" fill="#ECF5F0" stroke="#35705A" stroke-width="1.2"/><text x="223.5" y="190.0" font-size="20" fill="#35705A" font-weight="400" text-anchor="middle">✓</text><path d="M182.0 183.0 H203.5" fill="none" stroke="#5F6670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M243.5 183.0 H265.0" fill="none" stroke="#5F6670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="223.5" y="149.0" font-size="12" fill="#35705A" font-weight="400" text-anchor="middle">方案评审 · 通过</text><rect x="436.5" y="159.0" width="40" height="48" rx="19.0" fill="#FAEEEE" stroke="#A14E50" stroke-width="1.2"/><text x="456.5" y="190.0" font-size="20" fill="#A14E50" font-weight="400" text-anchor="middle">×</text><path d="M415.0 183.0 H436.5" fill="none" stroke="#5F6670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M476.5 183.0 H498.0" fill="none" stroke="#5F6670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="456.5" y="149.0" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="middle">准出检查 · 阻断</text><path d="M456.5 207.0 V270" fill="none" stroke="#A14E50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="391.5" y="270" width="130" height="44" rx="6" fill="#FAEEEE" stroke="#A14E50" stroke-width="1.2"/><text x="401.5" y="295.0" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="start">阻断：修复后重验</text><path d="M32 351 H648" fill="none" stroke="#E4E3DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="376.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">门禁状态是当前真实结论；未通过即阻断，须修复后重验。</text><text x="32" y="408.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">合成示例 · document-neutral</text></g></svg>
