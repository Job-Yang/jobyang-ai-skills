<svg xmlns="http://www.w3.org/2000/svg" width="680" height="425" viewBox="0 0 680 425" role="img"><title>回答质量如何自我收敛</title><desc>负反馈意味着系统趋向稳定；干预点是人工修正入口。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5F6670" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">反馈回路图</text><text x="32" y="74.0" font-size="26" fill="#1A1B1C" font-weight="600" text-anchor="start">回答质量如何自我收敛</text><text x="32" y="105.0" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">回环走外围 · 虚线表示反馈通道</text><rect x="240" y="165" width="200" height="90" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="252" y="190.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">检索与生成回答</text><rect x="48" y="195" width="110" height="44" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="60" y="220.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">用户提问</text><rect x="520" y="195" width="110" height="44" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="532" y="220.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">回答</text><path d="M158 217 H240" fill="none" stroke="#5F6670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M440 217 H520" fill="none" stroke="#5F6670" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M575 239 V320 H103 V239" fill="none" stroke="#35705A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4" /><rect x="117.12" y="295" width="245.76" height="18" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="240" y="308.0" font-size="12" fill="#35705A" font-weight="400" text-anchor="middle">负反馈 · 自我收敛 · 触发：质量低于阈值</text><rect x="430" y="302" width="140" height="36" rx="6" fill="#FBF3E7" stroke="#9A6A2F" stroke-width="1.2"/><text x="440" y="323.0" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="start">人工标注修正</text><path d="M32 356 H648" fill="none" stroke="#E4E3DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="381.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">负反馈意味着系统趋向稳定；干预点是人工修正入口。</text><text x="32" y="413.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">合成示例 · document-neutral</text></g></svg>
