<svg xmlns="http://www.w3.org/2000/svg" width="680" height="575" viewBox="0 0 680 575" role="img"><title>迁移分四个时间点推进</title><desc>事件是时间点；持续工作与依赖应另用甘特图。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="white"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">水平时间线</text><text x="32" y="74.0" font-size="26" fill="#1F2329" font-weight="600" text-anchor="start">迁移分四个时间点推进</text><text x="32" y="105.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">横轴为项目日 D · 位置按实际时间间隔计算</text><path d="M64 311 H616" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="32" y="153" width="168" height="110" rx="8" fill="#EAE2FE" stroke="#7456B2" stroke-width="1.2"/><text x="44" y="178.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">D0 · 基线确认</text><text x="44" y="204.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">冻结当前口径</text><path d="M84.0 311 V263" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="84.0" cy="311" r="5" fill="#EAE2FE" stroke="#7456B2"/><rect x="75.23" y="326" width="17.54" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="84.0" y="340.0" font-size="13" fill="#1F2329" font-weight="400" text-anchor="middle">0</text><rect x="128.0" y="358" width="168" height="110" rx="8" fill="#DFF5E5" stroke="#367747" stroke-width="1.2"/><text x="140.0" y="383.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">D3 · 双写验证</text><text x="140.0" y="409.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">比较两侧结果</text><path d="M212.0 311 V3