<svg xmlns="http://www.w3.org/2000/svg" width="680" height="713" viewBox="0 0 680 713" role="img"><title>资料申请在责任方之间流转</title><desc>展示申请通过的路径；拒绝和补充材料应另列分支。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="white"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">垂直泳道图</text><text x="32" y="74.0" font-size="26" fill="#1F2329" font-weight="600" text-anchor="start">资料申请在责任方之间流转</text><text x="32" y="105.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">泳道表示责任方 · 时间从上向下</text><rect x="32.0" y="148" width="195.33333333333334" height="483" rx="8" fill="#EAE2FE" stroke="#7456B2" stroke-width="1.2"/><text x="48.0" y="180.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">申请人</text><rect x="237.33333333333334" y="148" width="195.33333333333334" height="483" rx="8" fill="#DFF5E5" stroke="#367747" stroke-width="1.2"/><text x="253.33333333333334" y="180.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">资料负责人</text><rect x="442.6666666666667" y="148" width="195.33333333333334" height="483" rx="8" fill="#FEF1CE" stroke="#896B21" stroke-width="1.2"/><text x="458.6666666666667" y="180.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">系统</text><rect x="47.0" y="208" width="165.33333333333334" height="73" rx="8" fill="white" stroke="#7456B2" stroke-width="1.2"/><text x="59.0" y="233.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">提交使用说明</text><rect x="252.33333333333334" y="315" width="165.33333333333334" height="73" rx="8" fill="white" stroke="#367747" stroke-width="1.2"/><text x="264.33333333333337" y="340.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">核对范围与期限