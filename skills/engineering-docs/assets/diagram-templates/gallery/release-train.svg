<svg xmlns="http://www.w3.org/2000/svg" width="680" height="780" viewBox="0 0 680 780" role="img"><title>按发布窗口组织功能上车</title><desc>上线后异常按预定条件回退；正式流程需补实际门槛。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="white"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">火车发布上线流程图</text><text x="32" y="74.0" font-size="26" fill="#1F2329" font-weight="600" text-anchor="start">按发布窗口组织功能上车</text><text x="32" y="105.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">准出通过才上线 · 未就绪延期，准出失败阻断</text><rect x="32" y="311" width="145" height="95" rx="8" fill="#EAE2FE" stroke="#7456B2" stroke-width="1.2"/><text x="44" y="336.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">集成入列</text><text x="44" y="362.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">核对版本与依赖</text><rect x="189" y="311" width="145" height="95" rx="8" fill="#DFF5E5" stroke="#367747" stroke-width="1.2"/><text x="201" y="336.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">候选构建</text><text x="201" y="362.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">产出可追溯版本</text><path d="M177 358 H189" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="346" y="311" width="145" height="95" rx="8" fill="#FEF1CE" stroke="#896B21" stroke-width="1.2"/><text x="358" y="336.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">准出检查</text><text x="358" y="362.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">回归与风险验证</text><path d="M334 358 H346" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="503" y="311" width="145" height="95" rx="8" fill="#F0F4FC" stroke="#4063A8" stroke-width="1.2"/><text x="515" y="336.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">发布上线</text><text x="515" y="362.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">按窗口逐步放量</text><path d="M491 358 H503" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="32" y="157" width="195" height="88" rx="8" fill="white" stroke="#367747" stroke-width="1.2"/><text x="44" y="182.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">已就绪功能</text><text x="44" y="208.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">验收通过，依赖已满足</text><rect x="253" y="157" width="195" height="88" rx="8" fill="white" stroke="#AF4643" stroke-width="1.2"/><text x="265" y="182.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">未就绪功能</text><text x="265" y="208.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">保留原范围，不强行上车</text><path d="M129 245 V283 H104 V311" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="108.0" y="265" width="88" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="152" y="279.0" font-size="13" fill="#1F2329" font-weight="400" text-anchor="middle">满足上车条件</text><rect x="479" y="157" width="169" height="88" rx="8" fill="#F0F4FC" stroke="#4063A8" stroke-width="1.2"/><text x="491" y="182.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">下一班列车</text><text x="491" y="208.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">重新满足准入条件</text><path d="M448 201 H479" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4" /><rect x="203" y="481" width="274" height="79" rx="8" fill="#FEE3E2" stroke="#AF4643" stroke-width="1.2"/><text x="215" y="506.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">准出失败：阻断本次发布</text><text x="215" y="532.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">修复并重新验证，不自动跳过</text><path d="M418 406 V450 H340 V481" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="390.5" y="432" width="75" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="428" y="446.0" font-size="13" fill="#1F2329" font-weight="400" text-anchor="middle">不满足条件</text><rect x="32" y="605" width="250" height="63" rx="8" fill="white" stroke="#367747" stroke-width="1.2"/><text x="44" y="630.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">上线后按观测窗口确认</text><rect x="418" y="605" width="230" height="63" rx="8" fill="white" stroke="#AF4643" stroke-width="1.2"/><text x="430" y="630.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">执行预先验证的回退</text><path d="M576 406 V584 H178 V605" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><path d="M282 637 H418" fill="none" stroke="#707680" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="305.0" y="617" width="88" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="349" y="631.0" font-size="13" fill="#1F2329" font-weight="400" text-anchor="middle">触发回退条件</text><path d="M32 711 H648" fill="none" stroke="#DEE0E3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="736.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">上线后异常按预定条件回退；正式流程需补实际门槛。</text><text x="32" y="768.0" font-size="12" fill="#646A73" font-weight="400" text-anchor="start">合成示例 · document-pastel</text></g></svg>
