arker-end="url(#arrow)" /><rect x="309.0" y="353" width="62" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="340.0" y="367.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">任务信封</text><path d="M417.0 436 H571.0" fill="none" stroke="#1A1B1C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="463.0" y="415" width="62" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="494.0" y="429.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">启动会话</text><path d="M571.0 476 H417.0" fill="none" stroke="#1A1B1C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4" /><rect x="469.5" y="455" width="49" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="494.0" y="469.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">要权限</text><path d="M417.0 516 H263.0" fill="none" stroke="#1A1B1C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4" /><rect x="309.0" y="495" width="62" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="340.0" y="509.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">审批事件</text><path d="M263.0 556 H289.0 V576 H263.0" fill="none" stroke="#1A1B1C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="297.0" y="571.0" font-size="12" fill="#1A1B1C" font-weight="400" text-anchor="start">按放权规则判定</text><path d="M263.0 610 H417.0" fill="none" stroke="#5F6670" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4" /><rect x="322.0" y="589" width="36" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="340.0" y="603.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">批准</text><path d="M571.0 672 H417.0" fill="none" stroke="#1A1B1C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4" /><rect x="456.5" y="651" width="75" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="494.0" y="665.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">结束与产物</text><path d="M417.0 712 H263.0" fill="none" stroke="#1A1B1C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4" /><rect x="309.0" y="691" width="62" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="340.0" y="705.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">结束事件</text><path d="M263.0 752 H109.0" fill="none" stroke="#1A1B1C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 4" /><rect x="142.0" y="731" width="88" height="20" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="186.0" y="745.0" font-size="13" fill="#1A1B1C" font-weight="400" text-anchor="middle">验收结果摘要</text><text x="32" y="804.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">实线：同步调用    虚线：异步消息或返回    折回箭头：自身处理</text><path d="M32 833 H648" fill="none" stroke="#E4E3DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="858.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">规则内的权限请求管家自己批；结束事件只触发验收。</text><text x="32" y="890.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">合成示例 · document-neutral</text></g></svg>
