<svg xmlns="http://www.w3.org/2000/svg" width="680" height="902" viewBox="0 0 680 902" role="img"><title>Agent 的请求先由管家消化，验收通过才算完成</title><desc>规则内的权限请求管家自己批；结束事件只触发验收。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5F6670" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">时序图</text><text x="32" y="74.0" font-size="26" fill="#1A1B1C" font-weight="600" text-anchor="start">Agent 的请求先由管家消化，验收通过才算完成</text><text x="32" y="105.0" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">一次任务的成功路径 · 纵向只表示先后</text><rect x="28" y="196" width="624" height="192" rx="8" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="36" y="211.0" font-size="12" fill="#5F6670" font-weight="500" text-anchor="start">派活</text><rect x="28" y="392" width="624" height="232" rx="8" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="36" y="407.0" font-size="12" fill="#5F6670" font-weight="500" text-anchor="start">执行中</text><rect x="28" y="628" width="624" height="138" rx="8" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="36" y="643.0" font-size="12" fill="#5F6670" font-weight="500" text-anchor="start">验收</text><rect x="43.0" y="140" width="132" height="44" rx="8" fill="#FAFAF8" stroke="#D6DCE3" stroke-width="1.2"/><text x="109.0" y="168.0" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">你</text><path d="M109.0 184 V782" fill="none" stroke="#5F6670" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" /><rect x="197.0" y="140" width="132" height="44" rx="8" fill="#EDF2F8" stroke="#4F6B9A" stroke-width="1.2"/><text x="263.0" y="168.0" font-size="14" fill="#1A1B1C" font-weight="600" text-anchor="middle">管家</text><pa