<svg xmlns="http://www.w3.org/2000/svg" width="680" height="829" viewBox="0 0 680 829" role="img"><title>一个任务可以多次执行，每次修改都留版本</title><desc>重试、换 Agent 只新增 Run，任务历史不丢。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5F6670" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">ER 图</text><text x="32" y="74.0" font-size="26" fill="#1A1B1C" font-weight="600" text-anchor="start">一个任务可以多次执行，每次修改都留版本</text><text x="32" y="105.0" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">任务图对象模型 · 只画实体、键和基数</text><rect x="58.0" y="150" width="153.33333333333334" height="78" rx="8" fill="white" stroke="#D6DCE3" stroke-width="1.2"/><rect x="59.0" y="151" width="151.33333333333334" height="28" rx="7" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="68.0" y="170.0" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="start">Goal 目标组</text><text x="68.0" y="198.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">goal_id</text><text x="68.0" y="217.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">验收标准</text><rect x="468.6666666666667" y="150" width="153.33333333333334" height="78" rx="8" fill="white" stroke="#D6DCE3" stroke-width="1.2"/><rect x="469.6666666666667" y="151" width="151.33333333333334" height="28" rx="7" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="478.6666666666667" y="170.0" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="start">TaskType 任务类型</text><text x="478.6666666666667" y="198.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">type_id</text><text x="478.6666666666667" y="217.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">上下文配方</text><rect x="263.33333333333337" y="294" width="153.33333333333334" height="97" rx="8" fill="white" stroke="#4F6B9A" stroke-width="1.2"/><rect x="264.33333333333337" y="295" width="151.33333333333334" height="28" rx="7" fill="#EDF2F8" stroke="none" stroke-width="1.2"/><text x="273.33333333333337" y="314.0" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="start">Task 任务节点</text><text x="273.33333333333337" y="342.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">task_id</text><text x="273.33333333333337" y="361.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">状态（事件推导）</text><text x="273.33333333333337" y="380.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">rev</text><rect x="58.0" y="294" width="153.33333333333334" height="78" rx="8" fill="white" stroke="#D6DCE3" stroke-width="1.2"/><rect x="59.0" y="295" width="151.33333333333334" height="28" rx="7" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="68.0" y="314.0" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="start">Edge 边</text><text x="68.0" y="342.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">from / to</text><text x="68.0" y="361.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">阻塞 父子 引出</text><rect x="263.33333333333337" y="457" width="153.33333333333334" height="97" rx="8" fill="white" stroke="#D6DCE3" stroke-width="1.2"/><rect x="264.33333333333337" y="458" width="151.33333333333334" height="28" rx="7" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="273.33333333333337" y="477.0" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="start">Run 执行实例</text><text x="273.33333333333337" y="505.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">run_id</text><text x="273.33333333333337" y="524.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">adapter</text><text x="273.33333333333337" y="543.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">session_id</text><rect x="468.6666666666667" y="294" width="153.33333333333334" height="78" rx="8" fill="white" stroke="#D6DCE3" stroke-width="1.2"/><rect x="469.6666666666667" y="295" width="151.33333333333334" height="28" rx="7" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="478.6666666666667" y="314.0" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="start">Revision 版本</text><text x="478.6666666666667" y="342.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">rev</text><text x="478.6666666666667" y="361.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">谁改 为什么</text><rect x="263.33333333333337" y="620" width="153.33333333333334" height="59" rx="8" fill="white" stroke="#D6DCE3" stroke-width="1.2"/><rect x="264.33333333333337" y="621" width="151.33333333333334" height="28" rx="7" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="273.33333333333337" y="640.0" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="start">Artifact 产物</text><text x="273.33333333333337" y="668.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">path / link</text><rect x="468.6666666666667" y="620" width="153.33333333333334" height="59" rx="8" fill="white" stroke="#D6DCE3" stroke-width="1.2"/><rect x="469.6666666666667" y="621" width="151.33333333333334" height="28" rx="7" fill="#FAFAF8" stroke="none" stroke-width="1.2"/><text x="478.6666666666667" y="640.0" font-size="13" fill="#1A1B1C" font-weight="600" text-anchor="start">Review 验收</text><text x="478.6666666666667" y="668.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">通过 / 退回</text><text x="216.33333333333334" y="166.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">1</text><text x="308.66666666666674" y="286.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">1..*</text><text x="256.50000000000006" y="189.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle">包含</text><path d="M211.3 172.0 L301.7 172.0 L301.7 294.0" fill="none" stroke="#5F6670" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="463.6666666666667" y="166.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="end">1</text><text x="385.33333333333337" y="286.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">0..*</text><text x="423.5" y="189.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle">决定配方</text><path d="M468.7 172.0 L378.3 172.0 L378.3 294.0" fill="none" stroke="#5F6670" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="347.00000000000006" y="406.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">1</text><text x="347.00000000000006" y="451.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">0..*</text><text x="332.00000000000006" y="428.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="end">执行</text><path d="M340.0 391.0 L340.0 457.0" fill="none" stroke="#5F6670" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="257.33333333333337" y="334.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="end">1</text><text x="217.33333333333334" y="334.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">0..*</text><text x="237.33333333333337" y="357.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle">连接</text><path d="M263.3 340.0 L211.3 340.0" fill="none" stroke="#5F6670" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="422.66666666666674" y="334.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">1</text><text x="462.6666666666667" y="334.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="end">1..*</text><text x="442.66666666666674" y="357.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle">留版</text><path d="M416.7 340.0 L468.7 340.0" fill="none" stroke="#5F6670" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="347.00000000000006" y="569.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">1</text><text x="347.00000000000006" y="614.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">0..*</text><text x="332.00000000000006" y="591.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="end">产出</text><path d="M340.0 554.0 L340.0 620.0" fill="none" stroke="#5F6670" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="422.66666666666674" y="660.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="start">1..*</text><text x="462.6666666666667" y="660.0" font-size="12" fill="#1A1B1C" font-weight="600" text-anchor="end">1</text><text x="442.66666666666674" y="683.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="middle">提交</text><path d="M416.7 666.0 L468.7 666.0" fill="none" stroke="#5F6670" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="719.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">数字为关系两端的基数：1 恰好一个，0..* 零个或多个</text><path d="M32 760 H648" fill="none" stroke="#E4E3DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="785.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">重试、换 Agent 只新增 Run，任务历史不丢。</text><text x="32" y="817.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">合成示例 · document-neutral</text></g></svg>
