<svg xmlns="http://www.w3.org/2000/svg" width="680" height="665" viewBox="0 0 680 665" role="img"><title>产品主张由哪些能力支撑</title><desc>表达定位与支撑关系，不代表已经验证的市场效果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="white"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">品牌屋</text><text x="32" y="74.0" font-size="26" fill="#1F2329" font-weight="600" text-anchor="start">产品主张由哪些能力支撑</text><text x="32" y="105.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">屋顶是主张，立柱是支撑，地基是共同原则</text><polygon points="50,245 340,149 630,245" fill="#EAE2FE" stroke="#7456B2"/><text x="340" y="215.0" font-size="20" fill="#1F2329" font-weight="600" text-anchor="middle">让团队更容易找到可信知识</text><rect x="50" y="260" width="580" height="64" rx="0" fill="#DFF5E5" stroke="#367747" stroke-width="1.2"/><text x="340" y="297.0" font-size="17" fill="#1F2329" font-weight="600" text-anchor="middle">从资料到答案，保留可追溯依据</text><rect x="50.0" y="339" width="185.33333333333334" height="146" rx="8" fill="#FEF1CE" stroke="#896B21" stroke-width="1.2"/><text x="62.0" y="364.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">找得到</text><text x="62.0" y="390.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">统一检索</text><text x="62.0" y="408.2" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">清楚分类</text><rect x="247.33333333333334" y="339" width="185.33333333333334" height="146" rx="8" fill="#F0F4FC" stroke="#4063A8" stroke-width="1.2"/><text x="259.33333333333337" y="364.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">信得过</text><text x="259.33333333333337" y="390.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">标注来源</text><text x="259.33333333333337" y="408.2" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">及时更新</text><rect x="444.6666666666667" y="339" width="185.33333333333334" height="146" rx="8" fill="#FEE3E2" stroke="#AF4643" stroke-width="1.2"/><text x="456.6666666666667" y="364.0" font-size="15" fill="#1F2329" font-weight="600" text-anchor="start">用得上</text><text x="456.6666666666667" y="390.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">贴近任务</text><text x="456.6666666666667" y="408.2" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">方便复用</text><rect x="50" y="501" width="580" height="64" rx="0" fill="#F0F4FC" stroke="#4063A8" stroke-width="1.2"/><text x="340" y="538.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="middle">共同基础：权限清晰、内容可维护、变更可追溯</text><path d="M32 596 H648" fill="none" stroke="#DEE0E3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="621.0" font-size="13" fill="#646A73" font-weight="400" text-anchor="start">表达定位与支撑关系，不代表已经验证的市场效果。</text><text x="32" y="653.0" font-size="12" fill="#646A73" font-weight="400" text-anchor="start">合成示例 · document-pastel</text></g></svg>
