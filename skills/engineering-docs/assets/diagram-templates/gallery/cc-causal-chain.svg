<svg xmlns="http://www.w3.org/2000/svg" width="680" height="355" viewBox="0 0 680 355" role="img"><title>一次线上投诉的因果链</title><desc>极性是待验证假设；延迟为经验值，不表示精确耗时。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5F6670" stroke-width="1.5"/></marker></defs><rect width="680" height="100%" fill="#FFFFFF"/><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><text x="32" y="31.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">因果链图</text><text x="32" y="74.0" font-size="26" fill="#1A1B1C" font-weight="600" text-anchor="start">一次线上投诉的因果链</text><text x="32" y="105.0" font-size="14" fill="#5F6670" font-weight="400" text-anchor="start">左到右因果传递 · 绿=增强，红=抑制</text><rect x="32.0" y="210" width="110" height="58" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="44.0" y="235.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">流量上升</text><rect x="285.0" y="210" width="110" height="58" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="297.0" y="235.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">依赖超时</text><rect x="538.0" y="210" width="110" height="58" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="550.0" y="235.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">错误率上升</text><path d="M142.0 239.0 H285.0" fill="none" stroke="#35705A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="188.54" y="254.0" width="49.92" height="18" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="213.5" y="267.0" font-size="12" fill="#35705A" font-weight="400" text-anchor="middle">+ 增强</text><path d="M395.0 239.0 H538.0" fill="none" stroke="#35705A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="407.1" y="254.0" width="118.80000000000001" height="18" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="466.5" y="267.0" font-size="12" fill="#35705A" font-weight="400" text-anchor="middle">+ 增强 · 约十分钟</text><rect x="285.0" y="130" width="110" height="64" rx="8" fill="#EEF3F7" stroke="#D9E2E8" stroke-width="1.2"/><text x="297.0" y="155.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">缓存命中下</text><text x="297.0" y="176.0" font-size="15" fill="#1A1B1C" font-weight="600" text-anchor="start">降</text><path d="M340.0 210 V194" fill="none" stroke="#A14E50" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><rect x="315.04" y="189" width="49.92" height="18" rx="3" fill="white" stroke="none" stroke-width="1.2"/><text x="340.0" y="202.0" font-size="12" fill="#A14E50" font-weight="400" text-anchor="middle">− 抑制</text><path d="M32 286 H648" fill="none" stroke="#E4E3DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="32" y="311.0" font-size="13" fill="#5F6670" font-weight="400" text-anchor="start">极性是待验证假设；延迟为经验值，不表示精确耗时。</text><text x="32" y="343.0" font-size="12" fill="#5F6670" font-weight="400" text-anchor="start">合成示例 · document-neutral</text></g></svg>
