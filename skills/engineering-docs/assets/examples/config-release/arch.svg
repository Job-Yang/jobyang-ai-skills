<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 862" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block" role="img" font-family="&quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif"><title>配置变更先灰度再全量，指标异常时自动回滚</title><desc>变更从入口进入发布编排，校验后存为不可变版本，按四个批次推送到集群；集群指标回到观测，异常时回滚控制切回上一版本。</desc><defs><marker id="ah-main" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#5F6670"/></marker><marker id="ah-normal" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#5F6670"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#4F6B9A"/></marker><marker id="ah-dash" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#5F6670"/></marker><marker id="ah-planned" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#4F6B9A"/></marker><marker id="ah-alert" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="11.25" markerHeight="11.25" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#9A6A2F"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g data-kind="zone" data-id="z0"><rect x="40.0" y="160.0" width="160.0" height="445.3" rx="7.5" fill="#F7F7F5" stroke="#5F6670" stroke-width="1.56"/><text x="59.5" y="187.1" font-size="17.5" fill="#5F6670" font-weight="600" text-anchor="start">变更入口</text></g><g data-kind="zone" data-id