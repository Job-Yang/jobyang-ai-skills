="legend"><rect x="40.0" y="115.8" width="20.0" height="20.0" rx="3.7" fill="#F4F6F9" stroke="#4F6B9A" stroke-width="1.38" stroke-dasharray="4 3"/><text x="67.5" y="131.4" font-size="15.6" fill="#5F6670" font-weight="400" text-anchor="start">本次新增</text><path d="M145.0 125.8 L177.5 125.8" stroke="#5F6670" stroke-width="2.50" marker-end="url(#ah-main)"/><text x="185.0" y="131.4" font-size="15.6" fill="#5F6670" font-weight="400" text-anchor="start">调用 / 下发</text><path d="M281.6 125.8 L314.1 125.8" stroke="#5F6670" stroke-width="1.56" stroke-dasharray="6 4" marker-end="url(#ah-dash)"/><text x="321.6" y="131.4" font-size="15.6" fill="#5F6670" font-weight="400" text-anchor="start">指标上报</text><path d="M399.1 125.8 L431.6 125.8" stroke="#9A6A2F" stroke-width="1.88" stroke-dasharray="6 4" marker-end="url(#ah-alert)"/><text x="439.1" y="131.4" font-size="15.6" fill="#5F6670" font-weight="400" text-anchor="start">异常回滚</text></g></svg>
