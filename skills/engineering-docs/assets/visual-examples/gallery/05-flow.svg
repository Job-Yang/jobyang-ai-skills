<svg xmlns="http://www.w3.org/2000/svg" width="680" height="858" viewBox="0 0 680 858" role="img"><title>并行检查，只重试写入</title><desc>等待两项检查返回；任一失败不写报告，写入最多 3 次。</desc><defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="blue-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="purple-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="teal-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="amber-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="red-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="gray-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="gray-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker></defs><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="680" height="858" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><rect x="32" y="26" width="32" height="4" rx="0" fill="#4063A8" stroke="none" stroke-width="1.2" /><text x="76" y="33" font-size="13" fill="#646A73" font-weight="600" text-anchor="start">05  /  流程图 · 控制规则</text><text x="32" y="74" font-size="26" fill="#1F2329" font-weight="600" text-anchor="start">并行检查，只重试写入</text><text x="32" y="103" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">目录有效且输出未占用才开始；输入目录始终只读</text><path d="M32 782 H648" fill="none" stroke="#D8E0EA" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"   /><text x="32" y="811" font-size="14" fill="#1F2329" font-weight="500" text-anchor="start">等待两项检查返回；任一失败不写报告，写入最多 3 次。</text><text x="32" y="848" font-size="12" fill="#646A73" font-weight="400" text-anchor="start">engineering-docs · 合成示例 · 680px 正文版</text><rect x="100" y="233" width="480" height="168" rx="8" fill="#EAE2FE" stroke="none" stroke-width="1.2" /><text x="112" y="257" font-size="13" fill="#646A73" font-weight="500" text-anchor="start">并行检查</text><rect x="24" y="508" width="624" height="268" rx="8" fill="#DFF5E5" stroke="none" stroke-width="1.2" /><text x="38" y="535" font-size="13" fill="#646A73" font-weight="500" text-anchor="start">报告写入</text><path id="valid" d="M340 135.0 L419.0 170 L340 205.0 L261.0 170 Z" fill="#FEF1CE" stroke="#896B21" stroke-width="1.5"/><text x="340" y="175" font-size="15" fill="#1F2329" font-weight="600" text-anchor="middle">输入有效？</text><g id="reject"><rect x="502" y="144" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#AF4643" stroke-width="1.2" /><text x="572.0" y="175.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="middle">拒绝输入</text></g><rect x="205" y="245" width="270" height="4" rx="2" fill="#1F2329" stroke="none" stroke-width="1.2" id="fork"/><g id="scan"><rect x="118" y="280" width="174" height="66" rx="8" fill="#FFFFFF" stroke="#4063A8" stroke-width="1.2" /><text x="132" y="310.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">源码扫描</text><text x="132" y="333.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">最多 5 秒</text></g><g id="config"><rect x="388" y="280" width="174" height="66" rx="8" fill="#FFFFFF" stroke="#7456B2" stroke-width="1.2" /><text x="402" y="310.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">配置检查</text><text x="402" y="333.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">最多 5 秒</text></g><rect x="205" y="383" width="270" height="4" rx="2" fill="#1F2329" stroke="none" stroke-width="1.2" id="join"/><path id="passed" d="M340 411.0 L419.0 446 L340 481.0 L261.0 446 Z" fill="#FEF1CE" stroke="#896B21" stroke-width="1.5"/><text x="340" y="451" font-size="15" fill="#1F2329" font-weight="600" text-anchor="middle">均通过？</text><g id="checkfail"><rect x="502" y="420" width="140" height="52" rx="8" fill="#FFFFFF" stroke="#AF4643" stroke-width="1.2" /><text x="572.0" y="451.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="middle">检查失败</text></g><g id="write"><rect x="254" y="521" width="172" height="58" rx="8" fill="#FFFFFF" stroke="#367747" stroke-width="1.2" /><text x="268" y="547.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">写入报告</text><text x="268" y="570.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">每轮只做写入</text></g><path id="written" d="M340 600.0 L419.0 635 L340 670.0 L261.0 635 Z" fill="#FEF1CE" stroke="#896B21" stroke-width="1.5"/><text x="340" y="640" font-size="15" fill="#1F2329" font-weight="600" text-anchor="middle">写入成功？</text><g id="done"><rect x="264" y="715" width="152" height="52" rx="8" fill="#DFF5E5" stroke="#367747" stroke-width="1.2" /><text x="340.0" y="746.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="middle">报告完成</text></g><g id="exhausted"><rect x="502" y="685" width="140" height="58" rx="8" fill="#FFFFFF" stroke="#AF4643" stroke-width="1.2" /><text x="516" y="711.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">写入失败</text><text x="516" y="734.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">第 3 次仍失败</text></g><g id="wait"><rect x="38" y="605" width="150" height="64" rx="8" fill="#FFFFFF" stroke="#896B21" stroke-width="1.2" /><text x="52" y="634.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">等待 1 秒</text><text x="52" y="657.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">未满 3 次</text></g><path d="M419 170 H502" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#red-arrow)" id="e1" data-from="valid" data-to="reject"/><rect x="444.0" y="141" width="26" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="457" y="156" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">否</text><path d="M340 205 V245" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#blue-arrow)" id="e2" data-from="valid" data-to="fork"/><rect x="348.0" y="216" width="26" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="361" y="231" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">是</text><path d="M205 250 V280" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#blue-arrow)" id="e3" data-from="fork" data-to="scan"/><path d="M475 250 V280" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#purple-arrow)" id="e4" data-from="fork" data-to="config"/><path d="M205 346 V383" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#blue-arrow)" id="e5" data-from="scan" data-to="join"/><path d="M475 346 V383" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#purple-arrow)" id="e6" data-from="config" data-to="join"/><text x="339" y="370" font-size="14" fill="#646A73" font-weight="400" text-anchor="middle">等待全部</text><path d="M340 388 V411" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#gray-arrow)" id="e7" data-from="join" data-to="passed"/><path d="M419 446 H502" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#red-arrow)" id="e8" data-from="passed" data-to="checkfail"/><rect x="445.0" y="417" width="26" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="458" y="432" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">否</text><path d="M340 481 V521" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#teal-arrow)" id="e9" data-from="passed" data-to="write"/><rect x="350.0" y="492" width="26" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="363" y="507" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">是</text><path d="M340 579 V600" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#teal-arrow)" id="e10" data-from="write" data-to="written"/><path d="M340 670 V715" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#teal-arrow)" id="e11" data-from="written" data-to="done"/><rect x="350.0" y="682" width="26" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="363" y="697" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">是</text><path d="M261 635 H188" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#amber-arrow)" id="e12" data-from="written" data-to="wait"/><rect x="213.0" y="606" width="26" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="226" y="621" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">否</text><path d="M113 605 V550 H254" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#amber-arrow)" id="e13" data-from="wait" data-to="write"/><rect x="146.0" y="521" width="68" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="180" y="536" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">再次写入</text><path d="M419 635 H572 V685" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#red-arrow)" id="e14" data-from="written" data-to="exhausted"/><rect x="502.75" y="608" width="104.5" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="555" y="623" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">否，已满 3 次</text></g></svg>
