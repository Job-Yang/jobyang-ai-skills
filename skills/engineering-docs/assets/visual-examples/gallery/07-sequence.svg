<svg xmlns="http://www.w3.org/2000/svg" width="680" height="750" viewBox="0 0 680 750" role="img"><title>任务接收与任务完成分开确认</title><desc>接收回执沿 API 返回；后台完成后由客户端查询结果。</desc><defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="blue-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="purple-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="teal-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="amber-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="red-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="gray-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="gray-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker></defs><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="680" height="750" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><rect x="32" y="26" width="32" height="4" rx="0" fill="#4063A8" stroke="none" stroke-width="1.2" /><text x="76" y="33" font-size="13" fill="#646A73" font-weight="600" text-anchor="start">07  /  时序图 · 成功场景</text><text x="32" y="74" font-size="26" fill="#1F2329" font-weight="600" text-anchor="start">任务接收与任务完成分开确认</text><text x="32" y="103" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">纵向仅表示先后，不表示耗时；异步投递不等于处理完成</text><path d="M32 674 H648" fill="none" stroke="#D8E0EA" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"   /><text x="32" y="703" font-size="14" fill="#1F2329" font-weight="500" text-anchor="start">接收回执沿 API 返回；后台完成后由客户端查询结果。</text><text x="32" y="740" font-size="12" fill="#646A73" font-weight="400" text-anchor="start">engineering-docs · 合成示例 · 680px 正文版</text><rect x="35" y="208" width="610" height="172" rx="9" fill="#F0F4FC" stroke="none" stroke-width="1.2" /><text x="47" y="228" font-size="12" fill="#646A73" font-weight="500" text-anchor="start">接收任务</text><rect x="35" y="399" width="610" height="143" rx="9" fill="#EAE2FE" stroke="none" stroke-width="1.2" /><text x="47" y="419" font-size="12" fill="#646A73" font-weight="500" text-anchor="start">后台处理</text><rect x="35" y="546" width="610" height="88" rx="9" fill="#DFF5E5" stroke="none" stroke-width="1.2" /><text x="47" y="566" font-size="12" fill="#646A73" font-weight="500" text-anchor="start">查询结果</text><g id="client"><rect x="35" y="143" width="120" height="51" rx="8" fill="#FFFFFF" stroke="#646A73" stroke-width="1.2" /><text x="95.0" y="173.5" font-size="16" fill="#1F2329" font-weight="600" text-anchor="middle">客户端</text></g><path d="M95 194 V628" fill="none" stroke="#646A73" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"  /><g id="api"><rect x="200" y="143" width="120" height="51" rx="8" fill="#FFFFFF" stroke="#4063A8" stroke-width="1.2" /><text x="260.0" y="173.5" font-size="16" fill="#1F2329" font-weight="600" text-anchor="middle">任务 API</text></g><path d="M260 194 V628" fill="none" stroke="#4063A8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"  /><g id="queue"><rect x="365" y="143" width="120" height="51" rx="8" fill="#FFFFFF" stroke="#7456B2" stroke-width="1.2" /><text x="425.0" y="173.5" font-size="16" fill="#1F2329" font-weight="600" text-anchor="middle">任务队列</text></g><path d="M425 194 V628" fill="none" stroke="#7456B2" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"  /><g id="worker"><rect x="530" y="143" width="120" height="51" rx="8" fill="#FFFFFF" stroke="#367747" stroke-width="1.2" /><text x="590.0" y="173.5" font-size="16" fill="#1F2329" font-weight="600" text-anchor="middle">执行器</text></g><path d="M590 194 V628" fill="none" stroke="#367747" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"  /><path d="M95 238 H260" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#blue-arrow)" id="e1" data-from="client" data-to="api"/><rect x="143.0" y="209" width="68" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="177" y="224" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">提交任务</text><path d="M260 296 H425" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#purple-open)" id="e2" data-from="api" data-to="queue"/><rect x="308.0" y="267" width="68" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="342" y="282" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">投递消息</text><path d="M260 355 H95" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#blue-arrow)" id="e3" data-from="api" data-to="client"/><rect x="119.0" y="326" width="116.0" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="177" y="341" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">202 · task_id</text><path d="M425 459 H590" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#purple-open)" id="e4" data-from="queue" data-to="worker"/><rect x="473.0" y="430" width="68" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="507" y="445" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">交付任务</text><path d="M590 481 V510 H620 V535 H590" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#teal-arrow)" id="e5" data-from="worker" data-to="worker"/><text x="572" y="512" font-size="14" fill="#1F2329" font-weight="400" text-anchor="end">执行并保存结果</text><path d="M95 578 H260" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#blue-arrow)" id="e6" data-from="client" data-to="api"/><rect x="127.0" y="554" width="100.0" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="177" y="569" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">查询 task_id</text><path d="M260 613 H95" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#blue-arrow)" id="e7" data-from="api" data-to="client"/><rect x="143.0" y="584" width="68" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="177" y="599" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">返回结果</text><text x="280" y="576" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">API 读取报告</text><text x="280" y="600" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">省略存储交互</text><text x="37" y="648" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">实心：同步调用    开口：异步消息    虚线：返回</text></g></svg>
