<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" role="img"><title>原始输入与报告分开保存</title><desc>报告由校验结果生成，原始文档保留独立副本。</desc><defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="blue-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="purple-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="teal-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="amber-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="amber-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="red-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="red-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker><marker id="gray-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9 Z" fill="#707680"/></marker><marker id="gray-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#707680" stroke-width="1.5"/></marker></defs><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="680" height="650" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><rect x="32" y="26" width="32" height="4" rx="0" fill="#4063A8" stroke="none" stroke-width="1.2" /><text x="76" y="33" font-size="13" fill="#646A73" font-weight="600" text-anchor="start">09  /  数据流图 · 目标</text><text x="32" y="74" font-size="26" fill="#1F2329" font-weight="600" text-anchor="start">原始输入与报告分开保存</text><text x="32" y="103" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">箭头表示数据的移动方向；本例为批处理</text><path d="M32 574 H648" fill="none" stroke="#D8E0EA" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"   /><text x="32" y="603" font-size="14" fill="#1F2329" font-weight="500" text-anchor="start">报告由校验结果生成，原始文档保留独立副本。</text><text x="32" y="640" font-size="12" fill="#646A73" font-weight="400" text-anchor="start">engineering-docs · 合成示例 · 680px 正文版</text><g id="input"><rect x="46" y="158" width="168" height="72" rx="8" fill="#FFFFFF" stroke="#646A73" stroke-width="1.2" /><text x="60" y="191.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">原始文档</text><text x="60" y="214.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">输入数据</text></g><g id="parse"><rect x="286" y="158" width="168" height="72" rx="8" fill="#F0F4FC" stroke="#4063A8" stroke-width="1.2" /><text x="300" y="191.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">解析</text><text x="300" y="214.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">提取结构</text></g><g id="archive"><rect x="46" y="367" width="168" height="72" rx="8" fill="#FFFFFF" stroke="#367747" stroke-width="1.2" /><text x="60" y="400.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">原文归档</text><text x="60" y="423.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">只读副本</text></g><g id="check"><rect x="286" y="367" width="168" height="72" rx="8" fill="#FFFFFF" stroke="#7456B2" stroke-width="1.2" /><text x="300" y="400.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">规则校验</text><text x="300" y="423.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">生成问题列表</text></g><g id="report"><rect x="486" y="483" width="152" height="70" rx="8" fill="#FFFFFF" stroke="#367747" stroke-width="1.2" /><text x="500" y="515.0" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">报告文件</text><text x="500" y="538.0" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">输出数据</text></g><path d="M60 384 H200" fill="none" stroke="#367747" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"   /><path d="M214 194 H286" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#blue-arrow)" id="e1" data-from="input" data-to="parse"/><rect x="229.0" y="165" width="40" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="249" y="180" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">文档</text><path d="M130 230 V367" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#teal-arrow)" id="e2" data-from="input" data-to="archive"/><rect x="96.0" y="287" width="68" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="130" y="302" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">原文副本</text><path d="M370 230 V367" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#purple-arrow)" id="e3" data-from="parse" data-to="check"/><rect x="329.0" y="287" width="82" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="370" y="302" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">结构化内容</text><path d="M454 403 H562 V483" fill="none" stroke="#707680" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#teal-arrow)" id="e4" data-from="check" data-to="report"/><rect x="522.0" y="414" width="68" height="21" rx="3" fill="#FFFFFF" stroke="none" stroke-width="1.2" /><text x="556" y="429" font-size="14" fill="#707680" font-weight="400" text-anchor="middle">问题列表</text><text x="47" y="496" font-size="16" fill="#1F2329" font-weight="600" text-anchor="start">源数据 → 处理 → 输出</text><text x="47" y="523" font-size="14" fill="#646A73" font-weight="400" text-anchor="start">保存位置与控制流程分别说明</text></g></svg>
