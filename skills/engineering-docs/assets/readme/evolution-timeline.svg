<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block" role="img" font-family="&quot;PingFang SC&quot;, &quot;Noto Sans SC&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Microsoft YaHei&quot;, Arial, sans-serif"><title>这个技能长出来的几次真实转折，全是被 bad case 逼出来的</title><desc>迁入的内核在先；之后每一次改动都对应一个真踩过的坑</desc><defs><marker id="ah-main" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="12.00" markerHeight="12.00" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#4A6B8A"/></marker><marker id="ah-normal" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="12.00" markerHeight="12.00" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#8C867E"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="12.00" markerHeight="12.00" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#7A9CC6"/></marker><marker id="ah-dash" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="12.00" markerHeight="12.00" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#8C867E"/></marker><marker id="ah-planned" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="12.00" markerHeight="12.00" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#7A9CC6"/></marker><marker id="ah-alert" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="12.00" markerHeight="12.00" markerUnits="userSpaceOnUse" orient="auto"><path d="M0.8 0.9 L9.2 5 L0.8 9.1 z" fill="#C9A86A"/></marker></defs><rect width="100%" height="100%" fill="#FBFAF7"/><path d="M320.0 266.8 L360.0 266.8" fill="none" stroke="#4A6B8A" stroke-width="2.67" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-main)" data-points="320.0,266.8 360.0,266.8" data-kind="edge" data-from="c1" data-to="c2"/><path d="M640.0 266.8 L680.0 266.8" fill="none" stroke="#4A6B8A" stroke-width="2.67" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-main)" data-points="640.0,266.8 680.0,266.8" data-kind="edge" data-from="c2" data-to="c3"/><path d="M960.0 266.8 L1000.0 266.8" fill="none" stroke="#4A6B8A" stroke-width="2.67" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-main)" data-points="960.0,266.8 1000.0,266.8" data-kind="edge" data-from="c3" data-to="c4"/><g data-kind="banner" data-id="p1"><rect x="40.0" y="110.0" width="280.0" height="46.7" rx="10.6" fill="#F3EEE5" stroke="#E4DED2" stroke-width="1.33"/><rect x="54.4" y="118.2" width="30.2" height="30.2" rx="5.3" fill="#8C867E" stroke="none" stroke-width="0.00"/><text x="69.5" y="140.8" font-size="18.7" fill="#FFFFFF" font-weight="700" text-anchor="middle">01</text><text x="99.0" y="140.1" font-size="18.7" fill="#1F2329" font-weight="700" text-anchor="start">迁入</text><text x="151.3" y="140.1" font-size="17.2" fill="#3A3733" font-weight="400" text-anchor="start">内核先于本仓库</text></g><g data-kind="card" data-id="c1"><rect x="40.0" y="210.0" width="280.0" height="113.5" rx="10.6" fill="#FFFFFF" stroke="#E4DED2" stroke-width="1.47"/><text x="56.0" y="245.0" font-size="20.0" fill="#1F2329" font-weight="600" text-anchor="start">diagram_kit 已是成熟件</text><text x="56.0" y="277.2" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">纯标准库、自包含 SVG，</text><text x="56.0" y="301.5" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">从 Downloads 迁入</text></g><g data-kind="banner" data-id="p2"><rect x="360.0" y="110.0" width="280.0" height="46.7" rx="10.6" fill="#F3EEE5" stroke="#E4DED2" stroke-width="1.33"/><rect x="374.4" y="118.2" width="30.2" height="30.2" rx="5.3" fill="#8C867E" stroke="none" stroke-width="0.00"/><text x="389.5" y="140.8" font-size="18.7" fill="#FFFFFF" font-weight="700" text-anchor="middle">02</text><text x="419.0" y="129.6" font-size="18.7" fill="#1F2329" font-weight="700" text-anchor="start">路由 bad case</text><text x="419.0" y="148.3" font-size="17.2" fill="#3A3733" font-weight="400" text-anchor="start">0.1.3 · 10-19</text></g><g data-kind="card" data-id="c2"><rect x="360.0" y="210.0" width="280.0" height="113.5" rx="10.6" fill="#FFFFFF" stroke="#E8CFCB" stroke-width="1.47"/><text x="376.0" y="245.0" font-size="20.0" fill="#1F2329" font-weight="600" text-anchor="start">要用户点名才用</text><text x="376.0" y="277.2" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">细化流程图时手写</text><text x="376.0" y="301.5" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">mermaid、去画板从零摆节点</text></g><g data-kind="banner" data-id="p3"><rect x="680.0" y="110.0" width="280.0" height="46.7" rx="10.6" fill="#F3EEE5" stroke="#E4DED2" stroke-width="1.33"/><rect x="694.4" y="118.2" width="30.2" height="30.2" rx="5.3" fill="#8C867E" stroke="none" stroke-width="0.00"/><text x="709.5" y="140.8" font-size="18.7" fill="#FFFFFF" font-weight="700" text-anchor="middle">03</text><text x="739.0" y="140.1" font-size="18.7" fill="#1F2329" font-weight="700" text-anchor="start">写进路由表</text><text x="847.3" y="140.1" font-size="17.2" fill="#3A3733" font-weight="400" text-anchor="start">0.1.2–0.1.3</text></g><g data-kind="card" data-id="c3"><rect x="680.0" y="210.0" width="280.0" height="113.5" rx="10.6" fill="#FFFFFF" stroke="#C9D9E8" stroke-width="1.47"/><text x="696.0" y="245.0" font-size="20.0" fill="#1F2329" font-weight="600" text-anchor="start">图表达工程关系就归它</text><text x="696.0" y="277.2" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">description 扩触发面；</text><text x="696.0" y="301.5" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">画板只做发布适配器</text></g><g data-kind="banner" data-id="p4"><rect x="1000.0" y="110.0" width="240.0" height="46.7" rx="10.6" fill="#F3EEE5" stroke="#E4DED2" stroke-width="1.33"/><rect x="1014.4" y="118.2" width="30.2" height="30.2" rx="5.3" fill="#8C867E" stroke="none" stroke-width="0.00"/><text x="1029.5" y="140.8" font-size="18.7" fill="#FFFFFF" font-weight="700" text-anchor="middle">04</text><text x="1059.0" y="129.6" font-size="18.7" fill="#1F2329" font-weight="700" text-anchor="start">写作域治理</text><text x="1059.0" y="148.3" font-size="17.2" fill="#3A3733" font-weight="400" text-anchor="start">0.1.4–0.1.5</text></g><g data-kind="card" data-id="c4"><rect x="1000.0" y="210.0" width="240.0" height="137.8" rx="10.6" fill="#FFFFFF" stroke="#CDE1DC" stroke-width="1.47"/><text x="1016.0" y="245.0" font-size="20.0" fill="#1F2329" font-weight="600" text-anchor="start">借图不抢正文</text><text x="1016.0" y="277.2" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">feynman/talk 可</text><text x="1016.0" y="301.5" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">借 diagram_kit；</text><text x="1016.0" y="325.7" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">成稿过收尾</text></g><g data-kind="note" data-id="gap"><rect x="360.0" y="400.0" width="880.0" height="81.4" rx="10.6" fill="#F3EEE5" stroke="#E4DED2" stroke-width="1.33"/><rect x="360.0" y="400.0" width="5.3" height="81.4" rx="2.6" fill="#8C867E" stroke="none" stroke-width="0.00"/><text x="381.3" y="433.7" font-size="18.7" fill="#3A3733" font-weight="700" text-anchor="start">今天的状态</text><text x="381.3" y="458.5" font-size="17.3" fill="#3A3733" font-weight="400" text-anchor="start">机械检查器可跑；真实评审样本端到端的验证仍欠着——README 不把它写成已成熟</text></g><text x="340.0" y="252.8" font-size="16.7" fill="#3A3733" font-weight="500" text-anchor="middle">暴露</text><text x="660.0" y="252.8" font-size="16.7" fill="#3A3733" font-weight="500" text-anchor="middle">修</text><text x="980.0" y="252.8" font-size="16.7" fill="#3A3733" font-weight="500" text-anchor="middle">扩边界</text><g data-kind="header" data-id="header"><text x="42.7" y="71.5" font-size="32.0" fill="#1F2329" font-weight="700" text-anchor="start">这个技能长出来的几次真实转折，全是被 bad case 逼出来的</text><text x="42.7" y="104.4" font-size="18.7" fill="#3A3733" font-weight="400" text-anchor="start">迁入的内核在先；之后每一次改动都对应一个真踩过的坑</text></g></svg>
